<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Asimetitos: juego educativo para diseñar, gestionar y simular una misión espacial completa.">
<title>Asimetitos — Diseña tu misión espacial</title>
<style>
/* =====================================================================
   ASIMETITOS · Estilos — tema “Nebulosa” (cristal + neón)
   ===================================================================== */
:root{
  --bg:#2c3e79; --bg2:#2f4382;
  --glass:rgba(53,74,142,.55); --glass2:rgba(62,84,156,.6); --glass3:rgba(73,98,175,.7);
  --line:rgba(184,166,255,.16); --line2:rgba(174,190,241,.34);
  --text:#f4f6fd; --muted:#dbe1f3; --dim:#b9c2de;
  --cyan:#84e3d5; --violet:#b8a6ff; --pink:#ffb59e; --lime:#c8f096;
  --accent:#84e3d5; --accent2:#b8a6ff;
  --ok:#7ddf8a; --warn:#ffd27a; --bad:#ff8092; --gold:#f2c878;
  --grad:linear-gradient(120deg,#84e3d5 0%,#b8a6ff 50%,#ffb59e 100%);
  --radius:20px;
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;font-family:var(--sans);color:var(--text);background:var(--bg);line-height:1.5;min-height:100vh;font-size:16px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
  background:radial-gradient(38% 34% at 18% 22%,rgba(184,166,255,.38),transparent 70%),
    radial-gradient(32% 30% at 82% 18%,rgba(255,181,158,.24),transparent 70%),
    radial-gradient(42% 38% at 72% 86%,rgba(132,227,213,.18),transparent 70%),
    radial-gradient(30% 30% at 12% 86%,rgba(89,123,226,.28),transparent 70%);
  animation:nebula 40s ease-in-out infinite alternate}
@keyframes nebula{0%{transform:translate(0,0) scale(1) rotate(0)}50%{transform:translate(-3%,2%) scale(1.08) rotate(4deg)}100%{transform:translate(3%,-2%) scale(1.03) rotate(-3deg)}}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#phase:focus{outline:none}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .5em}
h2{font-size:1.35rem} h3{font-size:1.06rem;color:#eaeefb;letter-spacing:.01em} h4{font-size:.95rem;color:var(--muted)}
p{margin:.3em 0 .7em}
.skip{position:absolute;left:-9999px}.skip:focus{left:8px;top:8px;z-index:200;background:#000000;padding:8px;border-radius:6px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.gradtext{background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradmove 6s linear infinite}
@keyframes gradmove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(184,166,255,.55),0 8px 24px rgba(184,166,255,.45)}50%{box-shadow:0 0 0 14px rgba(184,166,255,0),0 8px 30px rgba(255,181,158,.55)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- Barra superior ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;background:rgba(45,64,126,.72);backdrop-filter:blur(14px) saturate(150%);border-bottom:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:.16em;font-size:1rem;cursor:pointer;white-space:nowrap;background:none;border:0;padding:4px;color:var(--text)}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .logo{display:inline-block;margin-right:6px;animation:spin 8s linear infinite}
.top-actions{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}

/* ---------- Botones ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:rgba(255,255,255,.05);padding:8px 15px;border-radius:999px;cursor:pointer;font-size:.9rem;min-height:38px;transition:background .2s,border-color .2s,transform .15s,box-shadow .2s;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--cyan);background:rgba(132,227,213,.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--grad);background-size:200% 100%;color:#1f2951;font-weight:800;border:0;box-shadow:0 8px 24px rgba(184,166,255,.45);animation:gradmove 5s linear infinite}
.btn.primary::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s}
.btn.primary:hover::after{left:120%}
.btn.primary:hover{box-shadow:0 10px 32px rgba(255,181,158,.55)}
.btn.big{font-size:1.1rem;padding:13px 28px;min-height:52px}
.btn.glow{animation:gradmove 5s linear infinite,pulse 2.2s ease-in-out infinite}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.btn.danger{color:#ffb8c6}
.btn.okb{background:rgba(125,223,138,.12);border-color:var(--ok);color:#c9ffe6}
.btn.badb{background:rgba(255,128,146,.14);border-color:var(--bad);color:#ffd0da}
.btn.sm{padding:5px 11px;min-height:30px;font-size:.82rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- Ayuda “?” ---------- */
.q{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:1px solid rgba(184,166,255,.7);color:#cbd5f6;background:rgba(184,166,255,.12);font-size:.7rem;font-weight:800;cursor:pointer;vertical-align:middle;padding:0;margin-left:4px;line-height:1;transition:.2s}
.q:hover{background:var(--violet);color:#ffffff;transform:scale(1.15) rotate(10deg)}

/* ---------- Paneles ---------- */
.panel{background:var(--glass);backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px;box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07)}
.secthead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.secthead h3{margin:0}
.owner{font-size:.74rem;border-radius:999px;padding:3px 10px;border:1px solid var(--line2);white-space:nowrap;background:rgba(0,0,0,.2)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid2>.panel{margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:3px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--muted);margin:2px 3px 2px 0}
.chip.acc{border-color:var(--cyan);color:var(--cyan)} .chip.ok{border-color:var(--ok);color:var(--ok)} .chip.warn{border-color:var(--warn);color:var(--warn)} .chip.bad{border-color:var(--bad);color:var(--bad)}
button.chip{cursor:pointer}
.chip.tog.on{background:var(--grad);color:#1f2951;border-color:transparent;font-weight:700}
.chips-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:10px;font-size:.9rem}
.stars{color:var(--gold);letter-spacing:1px;font-size:.85rem;text-shadow:0 0 8px rgba(242,200,120,.6)}
.hint{border:1px dashed rgba(184,166,255,.55);background:rgba(184,166,255,.08);border-radius:14px;padding:6px 12px;margin:12px 0 0;font-size:.9rem}
.hint summary{cursor:pointer;color:#cfd7f6;font-weight:700;list-style:none}
.hint summary::-webkit-details-marker{display:none}
.hint[open] summary{margin-bottom:4px}
.note{border-left:3px solid var(--cyan);background:rgba(132,227,213,.07);padding:9px 13px;border-radius:0 12px 12px 0;margin:8px 0;font-size:.92rem}
.note.warn{border-color:var(--warn);background:rgba(255,210,122,.08)} .note.bad{border-color:var(--bad);background:rgba(255,128,146,.09)} .note.ok{border-color:var(--ok);background:rgba(125,223,138,.08)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}
details>summary{cursor:pointer}
details.fold>summary{font-weight:700;font-size:1.04rem;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸ ";color:var(--cyan)}
details.fold[open]>summary::before{content:"▾ "}
details.fold[open]>summary{margin-bottom:10px}

/* ---------- Tarjetas (inclinación 3D + brillo que sigue al ratón) ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cards.wide{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;overflow:hidden;text-align:left;display:flex;flex-direction:column;gap:7px;width:100%;padding:13px 14px;border-radius:18px;
  background:linear-gradient(160deg,rgba(75,99,174,.5),rgba(50,72,141,.7));border:1px solid var(--line);cursor:pointer;color:var(--text);
  transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease,box-shadow .25s,border-color .25s,filter .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(132,227,213,.2),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.card:hover::before{opacity:1}
.card:hover{border-color:rgba(132,227,213,.55);box-shadow:0 14px 34px rgba(132,227,213,.14)}
.card.sel{border:1.5px solid transparent;background:linear-gradient(160deg,rgba(64,87,160,.95),rgba(51,73,144,.95)) padding-box,var(--grad) border-box;box-shadow:0 0 30px rgba(184,166,255,.45),0 0 70px rgba(132,227,213,.14)}
.card.sel::after{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 72%,rgba(255,255,255,.1) 82%,transparent 92%);animation:spin 7s linear infinite;pointer-events:none}
.card.dis{filter:grayscale(.75);opacity:.42;cursor:not-allowed}
.card.dis:hover{border-color:var(--line);box-shadow:none}
.card .ch{display:flex;align-items:center;gap:10px;padding-right:22px;position:relative;z-index:1}
.cico{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);transition:transform .3s}
.card:hover .cico,.card.sel .cico{transform:scale(1.1) rotate(-6deg)}
.card.sel .cico{background:rgba(132,227,213,.15);box-shadow:0 0 16px rgba(132,227,213,.4)}
.card .ct{font-weight:800;font-size:.95rem;line-height:1.2}
.card .cd{display:none;font-size:.82rem;color:var(--muted);position:relative;z-index:1}
.card.sel .cd{display:block;animation:rise .35s both}
.card .ck{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:.72rem;z-index:2}
.card.sel .ck{background:var(--grad);border-color:transparent;color:#1f2951;font-weight:900;animation:pop .4s both}
.specs{display:flex;flex-wrap:wrap;gap:4px;position:relative;z-index:1}
.spec{font-family:var(--mono);font-size:.72rem;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:2px 8px;color:#e1e7fa}
.card:not(.sel) .specs .spec:nth-child(n+4){display:none}
.delta{font-family:var(--mono);font-size:.73rem;color:var(--cyan);position:relative;z-index:1}
.delta .neg{color:var(--ok)} .delta .pos{color:var(--warn)}
.reason{font-size:.76rem;color:var(--warn);position:relative;z-index:1}
.extra{position:relative;z-index:1;font-size:.82rem}

/* ---------- Mosaicos grandes (inicio y escenarios) ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tiles.scen{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}
@media (max-width:860px){.tiles.scen{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.tiles.scen{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:16px 10px;border-radius:20px;cursor:pointer;color:var(--text);
  background:linear-gradient(160deg,rgba(75,99,174,.45),rgba(50,72,141,.7));border:1px solid var(--line);transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s,box-shadow .25s,border-color .25s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(200px circle at var(--mx) var(--my),rgba(255,181,158,.2),transparent 60%);opacity:0;transition:opacity .25s}
.tile:hover::before{opacity:1}
.tile:hover{border-color:rgba(255,181,158,.55)}
.tile.sel{border:1.5px solid transparent;background:linear-gradient(160deg,rgba(68,91,166,.95),rgba(52,73,144,.95)) padding-box,var(--grad) border-box;box-shadow:0 0 34px rgba(184,166,255,.5)}
.tico{font-size:2.3rem;line-height:1;filter:drop-shadow(0 4px 12px rgba(132,227,213,.35));transition:transform .35s}
.tile:hover .tico,.tile.sel .tico{transform:scale(1.18) translateY(-3px)}
.tile.sel .tico{animation:floaty 2.4s ease-in-out infinite}
.tname{font-weight:800;font-size:.95rem;position:relative}
.tsub{font-size:.74rem;color:var(--muted);position:relative}
.tile.sel .tsub{color:#e1e7fa}

/* ---------- Pantalla de inicio ---------- */
.start{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;padding:24px 8px 8px}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);text-align:center}.planet-wrap{margin:0 auto;width:200px;height:200px}}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);letter-spacing:.12em;margin:0;font-weight:900;line-height:1}
.hero h1 .l2{display:block}
.hero .tag{font-size:1.2rem;color:#eaeefb;margin:.6em 0 .2em}
.planet-wrap{position:relative;width:240px;height:240px}
.planet{position:absolute;inset:30px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 32% 30%,#9ce6ff 0%,#3b7cff 32%,#3d55a0 62%,#31478a 80%);
  box-shadow:inset -34px -24px 60px rgba(0,0,0,.65),0 0 60px rgba(132,227,213,.45),0 0 130px rgba(184,166,255,.4)}
.planet::before{content:"";position:absolute;inset:0;width:200%;
  background:radial-gradient(14% 18% at 12% 40%,rgba(125,223,138,.55),transparent 70%),radial-gradient(10% 14% at 30% 65%,rgba(125,223,138,.45),transparent 70%),radial-gradient(16% 10% at 42% 30%,rgba(255,255,255,.35),transparent 70%),
    radial-gradient(14% 18% at 62% 40%,rgba(125,223,138,.55),transparent 70%),radial-gradient(10% 14% at 80% 65%,rgba(125,223,138,.45),transparent 70%),radial-gradient(16% 10% at 92% 30%,rgba(255,255,255,.35),transparent 70%);
  animation:planetspin 22s linear infinite;mix-blend-mode:screen}
@keyframes planetspin{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.planet::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 75% 70%,rgba(0,0,0,.55),transparent 60%)}
.orbit-tilt{position:absolute;inset:0;transform:rotate(-18deg) scaleY(.36)}
.orbit-line{position:absolute;inset:-6px;border-radius:50%;border:1.5px dashed rgba(132,227,213,.5)}
.orbit-spin{position:absolute;inset:-6px;border-radius:50%;animation:spin 6s linear infinite}
.sat-dot{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#ffffff;box-shadow:0 0 12px #84e3d5,0 0 26px #ffb59e}
.start-sec{margin-top:22px;text-align:center}
.start .tiles{display:flex;flex-wrap:wrap;justify-content:center}
.start .tile{width:168px}
@media (max-width:420px){.start .tile{width:calc(50% - 6px)}}
.start-sec h2{font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.start-sec h2 b{color:var(--cyan)}
.start-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0}
.team-setup{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:12px}
.team-setup input,.team-setup select{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;padding:9px;width:100%}
.team-setup label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
.anim-in>*{animation:rise .55s both}
.anim-in>*:nth-child(2){animation-delay:.06s}.anim-in>*:nth-child(3){animation-delay:.12s}.anim-in>*:nth-child(4){animation-delay:.18s}.anim-in>*:nth-child(5){animation-delay:.24s}.anim-in>*:nth-child(6){animation-delay:.3s}.anim-in>*:nth-child(n+7){animation-delay:.36s}

/* ---------- Barra de fases con cohete ---------- */
.game{max-width:1560px;margin:0 auto;padding:12px 14px}
.track{position:relative;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));padding:6px 0 4px;margin-bottom:12px}
.track-line{position:absolute;left:6.25%;right:6.25%;top:26px;height:4px;border-radius:4px;background:rgba(255,255,255,.08)}
.track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--grad);box-shadow:0 0 12px rgba(184,166,255,.7);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;color:var(--muted);padding:0}
.node .nd{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;background:#32488d;border:2px solid var(--line2);transition:transform .25s,box-shadow .25s,border-color .25s}
.node:hover .nd{transform:scale(1.12);border-color:var(--cyan)}
.node .nl{font-size:.74rem;font-weight:700;text-align:center;line-height:1.1}
.node.done .nd{border-color:var(--violet);background:#3a52a2}
.node.cur .nd{border-color:transparent;background:linear-gradient(#354b92,#354b92) padding-box,var(--grad) border-box;box-shadow:0 0 22px rgba(255,181,158,.6);transform:scale(1.14)}
.node.cur .nl{color:#ffffff}
.node.lock{opacity:.4;cursor:not-allowed}
.rocket{position:absolute;top:-12px;z-index:2;font-size:1.25rem;transform:translateX(-50%) rotate(45deg);transition:left .9s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 8px rgba(255,210,122,.9));pointer-events:none}
@media (max-width:760px){.node .nl{display:none}.node.cur .nl{display:block;position:absolute;top:48px;white-space:nowrap}.node .nd{width:34px;height:34px;font-size:.95rem}.track{margin-bottom:22px}.track-line{top:22px}}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
#phase,#dashboard{min-width:0}
.phase-head h2 .hico{display:inline-block;margin-right:8px;-webkit-text-fill-color:initial}
.phase-head{margin:4px 0 14px}
.eyebrow{font-family:var(--mono);font-size:.76rem;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase}
.phase-head h2{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:900;margin:.15em 0}
.lead{color:var(--muted);max-width:760px;font-size:1.02rem;margin:0}
.phase-nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0 30px;flex-wrap:wrap}

/* ---------- Panel de control: anillos ---------- */
.dash{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;padding:14px}
.dash-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dash-head h2{font-size:.9rem;margin:0;letter-spacing:.16em;text-transform:uppercase}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:6px;animation:blink 1.6s infinite}
.dash-mission{font-size:.78rem;color:var(--muted);margin:4px 0 10px}
.rings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px}
.ring{position:relative;background:none;border:0;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--text);border-radius:14px;transition:background .2s}
.ring:hover{background:rgba(255,255,255,.05)}
.ring .rw{position:relative;width:62px;height:62px}
.ring svg{width:62px;height:62px;transform:rotate(-90deg);overflow:visible}
.ring .rt{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6}
.ring .rv{fill:none;stroke:var(--rc);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--rc));transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring .ri{position:absolute;inset:0;display:grid;place-items:center;font-size:1.25rem}
.ring .rn{font-size:.7rem;font-weight:800;letter-spacing:.02em}
.ring .rvv{font-family:var(--mono);font-size:.62rem;color:var(--muted);text-align:center;line-height:1.15;min-height:1.5em}
.g-ok{--rc:var(--ok)} .g-warn{--rc:var(--warn)} .g-bad{--rc:var(--bad)}
.g-bad .rw{animation:alarm 1.3s ease-in-out infinite}
@keyframes alarm{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.alerts{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;padding:7px 10px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);animation:rise .35s both}
.alert.bad{border-color:rgba(255,128,146,.55);background:rgba(255,128,146,.1)} .alert.warn{border-color:rgba(255,210,122,.45);background:rgba(255,210,122,.07)}
.alert.okall{border-color:rgba(125,223,138,.45);background:rgba(125,223,138,.07)}
.lastchange{font-size:.78rem;background:rgba(132,227,213,.08);border:1px solid rgba(132,227,213,.35);border-radius:12px;padding:7px 10px;margin:10px 0 0;animation:flash 1.2s}
@keyframes flash{0%{box-shadow:0 0 18px rgba(132,227,213,.7)}100%{box-shadow:none}}
.dash-toggle{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .dash{order:-1;position:sticky;top:54px;z-index:30;max-height:50vh}
  .dash-toggle{display:inline-flex}
  .dash.collapsed .dash-body,.dash.collapsed .dash-mission{display:none}
  .dash.collapsed .rings{grid-template-columns:repeat(8,minmax(0,1fr))}
  .dash.collapsed .ring .rw,.dash.collapsed .ring svg{width:36px;height:36px}
  .dash.collapsed .ring .ri{font-size:.85rem}
  .dash.collapsed .ring .rvv,.dash.collapsed .ring .rn{display:none}
}
.floaty{position:fixed;z-index:300;pointer-events:none;font:800 .82rem var(--mono);white-space:nowrap;text-shadow:0 0 10px currentColor}
.spark{position:fixed;z-index:300;pointer-events:none;width:7px;height:7px;border-radius:50%}

/* ---------- Equipo ---------- */
.team{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.ptabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.ptab{font-size:.78rem;border:1px solid var(--line2);background:rgba(255,255,255,.05);border-radius:999px;padding:4px 10px;cursor:pointer}
.ptab.on{background:var(--grad);color:#1f2951;border-color:transparent;font-weight:800}
.role{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:.78rem;padding:6px 0;border-bottom:1px dashed var(--line);align-items:start}
.role .rg{color:var(--muted);grid-column:2/4}
.proposal{border:1px solid var(--line);background:rgba(0,0,0,.2);border-radius:14px;padding:10px;margin:8px 0}
.proposal.pending{border-color:var(--warn)} .proposal.approved{border-color:var(--ok)} .proposal.rejected{border-color:var(--bad);opacity:.7}

/* ---------- Bloques de información compactos ---------- */
.brief{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.brief{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bt{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line);animation:rise .5s both}
.bt.ok{border-color:rgba(125,223,138,.45)} .bt.bad{border-color:rgba(255,128,146,.55);box-shadow:0 0 18px rgba(255,128,146,.15)}
.bi{font-size:1.5rem}
.bv{font-weight:800;font-size:.98rem;line-height:1.2}
.bl{font-size:.74rem;color:var(--muted)}
.bigval{font-family:var(--mono);font-size:2.2rem;font-weight:800;text-align:center;margin:4px 0}
.rangeticks{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
input[type=range]{width:100%;height:30px;accent-color:var(--pink);cursor:pointer}
.stgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:520px){.stgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{padding:10px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
.st .sl2{display:block;font-size:.72rem;color:var(--muted)}
.st .sv2{display:block;font-family:var(--mono);font-weight:800;font-size:.95rem}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.vt{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:.86rem;animation:rise .45s both}
.vt b{display:block}
.vt small{display:block;color:var(--muted);margin-top:2px}
.vt.ok{border-color:rgba(125,223,138,.45)} .vt.warn{border-color:rgba(255,210,122,.5)} .vt.bad{border-color:rgba(255,128,146,.55)}
.analogy{background:rgba(184,166,255,.1);border:1px solid rgba(184,166,255,.4);border-radius:14px;padding:9px 12px;margin-top:8px;font-size:.9rem}

/* ---------- Lanzadores ---------- */
.lrow{display:flex;align-items:center;gap:10px}
.lrocket{display:inline-block;transform:rotate(-45deg);filter:drop-shadow(0 0 8px rgba(255,160,80,.7));line-height:1;transition:transform .3s}
.card:hover .lrocket{transform:rotate(-45deg) translate(4px,-4px)}
.capbar{display:block;height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;width:100%}
.capbar>span{display:block;height:100%;border-radius:8px;transition:width .8s}
.capbar .ok{background:linear-gradient(90deg,#7ddf8a,var(--ok))} .capbar .warn{background:linear-gradient(90deg,#d6a31d,var(--warn))} .capbar .bad{background:linear-gradient(90deg,#d63155,var(--bad))}
.lstatus{font-size:.78rem;font-weight:700}

/* ---------- Fase 4: holograma y pestañas ---------- */
.p4top{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.p4top{grid-template-columns:minmax(0,1fr)}}
.holo{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid rgba(132,227,213,.35);background:radial-gradient(ellipse at 50% 45%,rgba(132,227,213,.16),rgba(45,66,128,.9) 65%);box-shadow:inset 0 0 40px rgba(132,227,213,.12)}
.holo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(132,227,213,.05) 0 2px,transparent 2px 5px);pointer-events:none;animation:scan 6s linear infinite}
@keyframes scan{from{background-position:0 0}to{background-position:0 120px}}
.scsvg{width:100%;height:auto;max-height:340px;display:block}
.scsvg .craft{animation:floaty 4s ease-in-out infinite;transform-origin:center}
.scsvg .part.pop{transform-box:fill-box;transform-origin:center;animation:pop .55s both}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.qs{padding:12px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px)}
.qs .qi{font-size:1.3rem}
.qs .qv{font-family:var(--mono);font-weight:800;font-size:1.05rem}
.qs .ql{font-size:.72rem;color:var(--muted)}
.qs.bad{border-color:rgba(255,128,146,.6)} .qs.warn{border-color:rgba(255,210,122,.5)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 12px}
.tab{position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);cursor:pointer;font-weight:700;font-size:.88rem;color:var(--muted);transition:.2s}
.tab:hover{color:#ffffff;border-color:var(--cyan)}
.tab.on{background:var(--grad);color:#1f2951;border-color:transparent;box-shadow:0 6px 20px rgba(184,166,255,.45)}
.tab .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.tab .dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad);animation:blink 1s infinite} .tab .dot.warn{background:var(--warn)}
.tabpanel{animation:rise .35s both}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;color:var(--text)}
.switch .knob{width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.25s;flex:none}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#ffffff;transition:.25s}
.switch.on .knob{background:var(--grad)} .switch.on .knob::after{left:21px}

/* ---------- Fase 5: flujo de datos ---------- */
.flow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 0}
.fnode{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:92px}
.fnode .fi{font-size:2.2rem;animation:floaty 3s ease-in-out infinite}
.fnode b{font-family:var(--mono);font-size:1.15rem}
.fnode small{font-size:.7rem;color:var(--muted)}
.pipe{position:relative;height:18px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line2);overflow:visible}
.pipe>span{position:absolute;inset:3px;border-radius:999px;background:repeating-linear-gradient(90deg,var(--pc,#7ddf8a) 0 10px,transparent 10px 26px);background-size:26px 100%;animation:flowing linear infinite;box-shadow:0 0 12px var(--pc,#7ddf8a)}
@keyframes flowing{from{background-position:0 0}to{background-position:26px 0}}
.flow.leak .pipe{--pc:#ffd27a} .flow.cut .pipe>span{animation:none;background:none;box-shadow:none}
.flow.cut .pipe::after{content:"✂";position:absolute;left:50%;top:-14px;font-size:1.3rem;color:var(--bad)}
.drip{position:absolute;top:14px;left:var(--x,50%);width:6px;height:9px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--bad);animation:drip 1.4s ease-in infinite;box-shadow:0 0 8px var(--bad)}
.drip.d2{--x:35%;animation-delay:.45s}.drip.d3{--x:65%;animation-delay:.9s}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(46px);opacity:0}}
.flowstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:22px}

/* ---------- Fase 6: GO / NO GO ---------- */
.verdict{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 20px;border-radius:var(--radius);border:1px solid var(--line2);margin-bottom:16px;animation:rise .5s both}
.verdict.go{background:linear-gradient(120deg,rgba(125,223,138,.18),rgba(132,227,213,.1));border-color:rgba(125,223,138,.6);box-shadow:0 0 40px rgba(125,223,138,.18)}
.verdict.nogo{background:linear-gradient(120deg,rgba(255,128,146,.2),rgba(184,166,255,.1));border-color:rgba(255,128,146,.6)}
.vlight{width:46px;height:46px;border-radius:50%;flex:none}
.verdict.go .vlight{background:radial-gradient(circle at 35% 35%,#c9ffe6,var(--ok));box-shadow:0 0 26px var(--ok);animation:blink 2s infinite}
.verdict.nogo .vlight{background:radial-gradient(circle at 35% 35%,#ffd0da,var(--bad));box-shadow:0 0 26px var(--bad);animation:blink .9s infinite}
.vt1{font-size:1.6rem;font-weight:900;letter-spacing:.06em}
.vt2{font-size:.86rem;color:var(--muted)}
.verdict .grow{flex:1}
.gogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.go{padding:11px 13px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid var(--line);animation:scanin .5s both}
@keyframes scanin{0%{opacity:0;transform:translateX(-12px);filter:brightness(2)}100%{opacity:1;transform:none;filter:none}}
.goh{display:flex;align-items:center;gap:8px}
.gos{font:900 .7rem var(--mono);padding:3px 8px;border-radius:999px;letter-spacing:.08em;flex:none}
.go.ok .gos{background:rgba(125,223,138,.18);color:var(--ok)} .go.warn .gos{background:rgba(255,210,122,.18);color:var(--warn)} .go.fail .gos{background:rgba(255,128,146,.2);color:var(--bad)} .go.info .gos{background:rgba(132,227,213,.16);color:var(--cyan)}
.go.fail{border-color:rgba(255,128,146,.6);box-shadow:0 0 18px rgba(255,128,146,.15);grid-column:1/-1}
.go.warn{border-color:rgba(255,210,122,.45)}
.go p{font-size:.84rem;color:var(--muted);margin:6px 0}
.go b{font-size:.88rem}

/* ---------- Tablas ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:rgba(0,0,0,.3);color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);white-space:nowrap}
tr.selrow td{background:rgba(132,227,213,.08)}

/* ---------- Simulación ---------- */
.launchpad{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
@media (max-width:640px){.launchpad{grid-template-columns:1fr;text-align:center}}
.padrocket{font-size:5.5rem;line-height:1;transform:rotate(-45deg);animation:padshake 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 30px rgba(255,140,60,.6))}
@keyframes padshake{0%,100%{transform:rotate(-45deg) translate(0,0)}50%{transform:rotate(-45deg) translate(3px,-5px)}}
.viz{width:100%;height:340px;display:block;background:radial-gradient(ellipse at center,#31478a 0%,#2b3e78 75%);border-radius:16px;border:1px solid var(--line)}
.viz.tall{height:420px}
.viz.chart{height:200px;background:rgba(0,0,0,.3)}
@media (max-width:600px){.viz{height:270px}.viz.tall{height:310px}}
.vizwrap{position:relative}
.vizwrap.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}100%{transform:translate(0,0)}}
.timeline{position:relative;height:66px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
.timeline .tl-axis{position:absolute;left:12px;right:12px;top:34px;height:3px;background:rgba(255,255,255,.1)}
.timeline .tl-prog{position:absolute;left:12px;top:34px;height:3px;background:var(--grad);box-shadow:0 0 10px rgba(255,181,158,.8);transition:width .2s}
.timeline .tl-m{position:absolute;top:8px;transform:translateX(-50%);font-size:1.05rem;text-align:center;line-height:1;animation:pop .4s both}
.timeline .tl-m span{display:block;font-size:.6rem;color:var(--muted);margin-top:18px;white-space:nowrap}
.evlog{max-height:340px;overflow:auto}
.ev{border:1px solid var(--line);border-left:4px solid var(--warn);background:rgba(0,0,0,.22);border-radius:12px;padding:9px 11px;margin:6px 0;font-size:.86rem;animation:rise .4s both}
.ev.mit{border-left-color:var(--ok)} .ev.sev{border-left-color:var(--bad)} .ev.info{border-left-color:var(--cyan)}
.ev .lesson{color:#cfd7f6;font-size:.82rem;margin-top:3px}
.simstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:700px){.simstats{grid-template-columns:repeat(2,1fr)}}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:9px 11px}
.stat .sv{font-family:var(--mono);font-size:1.2rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .sl{font-size:.74rem;color:var(--muted)}
.evpop{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:92%;background:rgba(48,67,133,.92);border:1px solid var(--warn);border-radius:14px;padding:9px 14px;font-size:.88rem;animation:evpop 4s forwards;pointer-events:none;box-shadow:0 0 30px rgba(255,210,122,.35)}
@keyframes evpop{0%{opacity:0;transform:translate(-50%,-10px) scale(.9)}8%,85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0}}

/* ---------- Informe ---------- */
.rating{display:flex;align-items:center;gap:22px;flex-wrap:wrap;padding:22px;border-radius:24px;border:1px solid var(--line2);background:linear-gradient(130deg,rgba(68,91,166,.6),rgba(51,72,140,.8));box-shadow:0 0 50px rgba(184,166,255,.3);animation:rise .6s both}
.rating .big{font-size:3.6rem;font-weight:900;font-family:var(--mono);line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rating .rl{font-size:1.7rem;font-weight:900;animation:stamp .7s .3s both}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-8deg)}60%{opacity:1;transform:scale(.92) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
.r-fail .rl{color:var(--bad)} .r-part .rl{color:var(--warn)} .r-ok .rl{color:var(--ok)} .r-exc .rl{color:var(--gold);text-shadow:0 0 20px rgba(242,200,120,.7)}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 11px;font-size:.8rem;margin:3px 4px 3px 0;background:rgba(242,200,120,.08);animation:pop .5s both}
.sbar{display:grid;grid-template-columns:190px 1fr 80px;gap:10px;align-items:center;margin:8px 0;font-size:.9rem}
.sbar .bar{height:12px;border-radius:12px;background:rgba(255,255,255,.08);overflow:hidden}
.sbar .fill{height:100%;border-radius:12px;background:var(--grad);transform-origin:left;animation:growx 1.2s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:600px){.sbar{grid-template-columns:1fr 70px}.sbar .bar{grid-column:1/3;grid-row:2}}
.causes li{margin:7px 0}
.imp{font-family:var(--mono);font-size:.74rem;border-radius:999px;padding:1px 7px;margin-left:6px;border:1px solid var(--line2)}
.imp.n{color:var(--bad);border-color:var(--bad)} .imp.p{color:var(--ok);border-color:var(--ok)}
.seg{border:1px solid var(--line);border-radius:14px;padding:11px;background:rgba(0,0,0,.2)}
.seg h4{color:var(--cyan);margin-bottom:4px}

/* ---------- Modales y avisos ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(44,63,120,.72);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(160deg,rgba(60,83,157,.97),rgba(48,67,133,.97));border:1px solid var(--line2);border-radius:22px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 22px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(184,166,255,.25);animation:pop .35s both}
.modal.wide{max-width:1050px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-18px;background:rgba(57,81,155,.98);padding:8px 0;z-index:2}
.modal-h h2{margin:0}
.modal textarea{width:100%;min-height:220px;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:12px;padding:10px;font-family:var(--mono);font-size:.82rem;color:#e3e8fa}
.modal input[type=text],.modal input[type=search]{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:12px;padding:10px}
.formula{font-family:var(--mono);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:6px 0 12px;font-size:.82rem;white-space:pre-wrap;color:#e1e7fa}
.gloss dt{font-weight:800;color:var(--cyan);margin-top:10px} .gloss dd{margin:2px 0 0;color:var(--muted)}
#toasts{position:fixed;bottom:16px;right:16px;z-index:150;display:flex;flex-direction:column;gap:8px;max-width:min(380px,92vw)}
.toast{background:rgba(56,77,147,.95);border:1px solid var(--cyan);border-radius:14px;padding:11px 14px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 20px rgba(132,227,213,.2);animation:toastIn .35s cubic-bezier(.2,.9,.3,1.3)}
.toast.warn{border-color:var(--warn)} .toast.bad{border-color:var(--bad)} .toast.ok{border-color:var(--ok)}
@keyframes toastIn{from{opacity:0;transform:translateX(30px) scale(.9)}to{opacity:1;transform:none}}

/* ---------- Tutorial ---------- */
#tut-layer{position:fixed;inset:0;z-index:120;pointer-events:none}
.tut-spot{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(44,63,120,.75);border:2px solid var(--cyan);transition:all .35s;pointer-events:none}
.tut-pop{position:fixed;max-width:360px;background:linear-gradient(160deg,rgba(62,87,164,.98),rgba(48,69,135,.98));border:1px solid var(--pink);border-radius:18px;padding:16px;pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,.6),0 0 30px rgba(255,181,158,.3);animation:pop .35s both}
.tut-pop h3{color:#ffffff}

footer.credits{color:var(--dim);font-size:.8rem;text-align:center;margin-top:20px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}

@media (max-width:760px){
  .top-actions .btn span{display:none}
  .top-actions .btn{padding:6px 9px}
  .brand{font-size:.86rem;letter-spacing:.08em}
  .panel{padding:13px}
}
@media (max-width:520px){
  .topbar{padding:6px 8px}
  .top-actions{flex-wrap:nowrap;gap:0}
  .top-actions .btn{padding:4px 6px;min-height:32px;font-size:.85rem}
  .brand{font-size:.76rem;letter-spacing:.03em}
}
/* =====================================================================
   TEMA “AURORA SUAVE” + ESTILO 3D
   ===================================================================== */
body{background:linear-gradient(180deg,#2d4184 0%,#2c3c79 55%,#283671 100%) fixed}
body::before{background:radial-gradient(38% 34% at 18% 22%,rgba(184,166,255,.22),transparent 70%),
    radial-gradient(32% 30% at 82% 18%,rgba(255,181,158,.14),transparent 70%),
    radial-gradient(42% 38% at 72% 86%,rgba(132,227,213,.13),transparent 70%),
    radial-gradient(30% 30% at 12% 86%,rgba(120,150,255,.16),transparent 70%);
  translate:calc(var(--px,0) * -22px) calc(var(--py,0) * -16px);transition:translate .4s ease-out}
.topbar{background:rgba(44,60,121,.78)}
.panel{box-shadow:inset 0 1px 0 rgba(255,255,255,.09),inset 0 -2px 0 rgba(6,10,30,.25),0 18px 40px rgba(6,10,30,.32)}

/* Tarjetas con grosor: canto inferior, luz especular y elevación */
.card,.tile{--lift:0px;transform:perspective(800px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 5px 0 -1px rgba(12,18,44,.6),0 10px 20px rgba(6,10,30,.3)}
.card::before,.tile::before{background:radial-gradient(220px circle at var(--mx) var(--my),rgba(255,255,255,.16),rgba(132,227,213,.06) 40%,transparent 65%)}
.card:not(.dis):hover,.tile:hover{--lift:-4px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 9px 0 -1px rgba(12,18,44,.55),0 22px 32px rgba(6,10,30,.42)}
.card.sel,.tile.sel{--lift:-3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 0 -1px rgba(83,70,171,.7),0 0 26px rgba(184,166,255,.32),0 20px 30px rgba(6,10,30,.35)}
.card:active:not(.dis),.tile:active{--lift:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 1px 0 -1px rgba(12,18,44,.6),0 4px 10px rgba(6,10,30,.3);transition-duration:.06s}

/* Botones que se hunden como teclas */
.btn{box-shadow:0 3px 0 rgba(10,16,40,.55)}
.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(10,16,40,.5)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(10,16,40,.5);transition-duration:.05s}
.btn.ghost,.btn.ghost:hover,.btn.ghost:active{box-shadow:none}
.btn.primary{box-shadow:0 4px 0 #6d63b3,0 10px 22px rgba(184,166,255,.28)}
.btn.primary:hover{box-shadow:0 6px 0 #6d63b3,0 14px 28px rgba(255,181,158,.3)}
.btn.primary:active{box-shadow:0 0 0 #6d63b3,0 4px 10px rgba(184,166,255,.2)}
@keyframes pulse{0%,100%{box-shadow:0 4px 0 #6d63b3,0 0 0 0 rgba(184,166,255,.45)}50%{box-shadow:0 4px 0 #6d63b3,0 0 0 14px rgba(184,166,255,0)}}
.tab{box-shadow:0 3px 0 rgba(10,16,40,.5)} .tab.on{box-shadow:0 3px 0 #6d63b3,0 6px 16px rgba(184,166,255,.3)}
.tab:active{transform:translateY(2px);box-shadow:none}

/* ---------- Inicio 3D ---------- */
.hero{display:block;text-align:center;padding:26px 8px 4px;perspective:900px}
.hero h1{display:inline-block;transform:rotateX(calc(var(--py,0) * 8deg)) rotateY(calc(var(--px,0) * -10deg));transition:transform .4s ease-out;
  text-shadow:0 1px 0 #c9d2f2,0 2px 0 #aeb8e0,0 3px 0 #929ccc,0 4px 0 #7781b6,0 6px 12px rgba(6,10,30,.5)}
.hero h1 .gradtext{text-shadow:none;filter:drop-shadow(0 3px 0 #6d63b3) drop-shadow(0 8px 14px rgba(6,10,30,.45))}
.hero .tag{margin-top:.5em}
.start-sec h2 b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#1f2951;box-shadow:0 3px 0 #6d63b3;margin-right:4px}
.sub-hint{font-size:.8rem;color:var(--dim);margin:8px 0 0}

/* Modo: personajes sobre plataformas */
.pods{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pod{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--lift:0px;position:relative;width:184px;padding:16px 10px 14px;border-radius:22px;border:1px solid var(--line);cursor:pointer;color:var(--text);
  background:linear-gradient(165deg,rgba(78,98,170,.55),rgba(48,64,133,.8));transform-style:preserve-3d;
  transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));transition:transform .25s,box-shadow .25s,border-color .25s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 0 -1px rgba(12,18,44,.6),0 12px 22px rgba(6,10,30,.3)}
.pod:hover{--lift:-5px;border-color:rgba(132,227,213,.6)}
.pod.sel{--lift:-4px;border:1.5px solid transparent;background:linear-gradient(165deg,rgba(92,110,196,.95),rgba(53,68,147,.95)) padding-box,var(--grad) border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 0 -1px rgba(83,70,171,.75),0 0 30px rgba(184,166,255,.35)}
.pod-fig{display:flex;justify-content:center;align-items:flex-end;height:78px;transform:translateZ(16px);transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.pod-fig span{display:inline-block;font-size:3.1rem;line-height:1;filter:drop-shadow(0 10px 6px rgba(6,10,30,.45))}
.pod-fig.many span{font-size:2.5rem;margin:0 -9px}
.pod-fig.many span:nth-child(2){font-size:3rem;transform:translateZ(14px)}
.pod:hover .pod-fig,.pod.sel .pod-fig{transform:translateZ(54px) translateY(-8px)}
.pod.sel .pod-fig span{animation:floaty 2.6s ease-in-out infinite}
.pod.sel .pod-fig span:nth-child(2){animation-delay:.3s}.pod.sel .pod-fig span:nth-child(3){animation-delay:.6s}
.pod-base{display:block;width:104px;height:18px;margin:-4px auto 8px;border-radius:50%;background:radial-gradient(closest-side,rgba(132,227,213,.75),rgba(132,227,213,.15) 70%,transparent);transform:translateZ(4px);box-shadow:0 0 18px rgba(132,227,213,.3)}
.pod.sel .pod-base{animation:basepulse 2.4s ease-in-out infinite}
@keyframes basepulse{0%,100%{opacity:.75;transform:translateZ(4px) scale(1)}50%{opacity:1;transform:translateZ(4px) scale(1.12)}}
.pod .tname,.pod .tsub{display:block;transform:translateZ(10px)}

/* Dificultad: insignias que se voltean */
.medals{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.medal{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;width:192px;height:226px;padding:0;border:0;background:none;cursor:pointer;color:var(--text);perspective:900px}
.medal-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .85s cubic-bezier(.3,1.35,.45,1)}
.medal.sel .medal-in{transform:rotateX(var(--rx)) rotateY(calc(180deg + var(--ry)))}
.mface{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 12px;border-radius:22px;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;border:1px solid var(--line2);
  background:linear-gradient(165deg,rgba(78,98,170,.6),rgba(48,64,133,.85));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 0 -1px rgba(12,18,44,.6),0 14px 24px rgba(6,10,30,.32)}
.mface.back{justify-content:flex-start;gap:3px;padding-top:12px;transform:rotateY(180deg);border:1.5px solid var(--m2);background:linear-gradient(165deg,rgba(92,110,196,.95),rgba(53,68,147,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 6px 0 -1px var(--m3),0 0 28px rgba(255,236,200,.22)}
.coin{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;font-size:1.05rem;letter-spacing:-1px;color:rgba(40,26,6,.8);font-weight:900;
  background:radial-gradient(circle at 32% 28%,var(--m1),var(--m2) 55%,var(--m3));box-shadow:inset 0 0 0 5px rgba(255,255,255,.28),inset 0 -6px 10px rgba(0,0,0,.25),0 7px 0 var(--m3),0 14px 20px rgba(6,10,30,.4);
  animation:coinspin 6s ease-in-out infinite}
@keyframes coinspin{0%,70%{transform:rotateY(0)}85%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.coin.sm{width:42px;height:42px;font-size:.7rem;animation:none;box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),0 4px 0 var(--m3)}
.m-beginner{--m1:#ffe0c2;--m2:#d4925a;--m3:#7d4c26}
.m-intermediate{--m1:#ffffff;--m2:#c5cddd;--m3:#6c7690}
.m-expert{--m1:#fff4c4;--m2:#f0c468;--m3:#8a6420}
.mlist{list-style:none;margin:2px 0 0;padding:0;width:100%;font-size:.78rem;text-align:left}
.mlist li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 2px;white-space:nowrap;border-bottom:1px dashed rgba(255,255,255,.12)}
.mlist li:last-child{border-bottom:0}
.mlist b{font-family:var(--mono);font-size:.78rem}

/* Misión: carrusel 3D */
.carousel{position:relative;max-width:900px;margin:0 auto;outline:none;border-radius:24px}
.carousel:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
.car-stage{position:relative;height:262px;perspective:1100px;transform-style:preserve-3d;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.car-stage.dragging{cursor:grabbing}
.car-floor{position:absolute;left:50%;top:112px;width:620px;max-width:92%;height:90px;transform:translateX(-50%) rotateX(78deg);border-radius:50%;
  background:radial-gradient(closest-side,rgba(132,227,213,.28),rgba(184,166,255,.1) 60%,transparent);border:1.5px dashed rgba(132,227,213,.35);pointer-events:none}
.car-item{position:absolute;left:50%;top:10px;width:170px;margin-left:-85px;padding:0;border:0;background:none;color:var(--text);cursor:pointer;will-change:transform,opacity;transform-style:preserve-3d}
.car-name{display:block;font-weight:800;font-size:.9rem;margin-top:6px;text-shadow:0 2px 8px rgba(6,10,30,.7);transition:opacity .3s}
.car-item:not(.sel) .car-name{opacity:.55;font-weight:600}
.car-arrow{position:absolute;top:96px;z-index:60;width:46px;height:46px;border-radius:50%;border:1px solid var(--line2);background:rgba(54,72,143,.8);color:var(--text);font-size:1.5rem;cursor:pointer;box-shadow:0 4px 0 rgba(10,16,40,.55);transition:transform .15s}
.car-arrow:hover{transform:scale(1.1);border-color:var(--cyan)} .car-arrow:active{transform:translateY(3px);box-shadow:none}
.car-arrow.l{left:0} .car-arrow.r{right:0}
.car-info{max-width:640px;margin:4px auto 0;padding:14px 18px;border-radius:20px;background:var(--glass);border:1px solid var(--line);animation:rise .4s both}
.car-info .ci-name{font-size:1.4rem;font-weight:900;margin:0}
.car-info p{margin:6px 0 0;font-size:.9rem;color:var(--muted)}
.car-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.car-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:.3s}
.car-dots i.on{width:22px;border-radius:6px;background:var(--grad)}

/* Objetos 3D de las misiones (CSS puro) */
.obj{position:relative;display:block;width:150px;height:150px;margin:0 auto;transform-style:preserve-3d;perspective:600px;transition:transform 1s cubic-bezier(.6,0,.9,.4),opacity .9s ease-in}
.sph{position:absolute;inset:22px;border-radius:50%;overflow:hidden;background:var(--base);box-shadow:inset -22px -16px 40px rgba(0,0,12,.6),0 0 34px var(--atm)}
.sph::before{content:"";position:absolute;inset:0;width:200%;background:var(--tex);animation:planetspin 20s linear infinite}
.sph::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.4),transparent 36%),radial-gradient(circle at 80% 78%,rgba(0,0,14,.62),transparent 62%)}
.sph .cap{position:absolute;left:28%;right:28%;top:-6%;height:20%;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(2px);z-index:1}
.sph.earth{--atm:rgba(132,200,255,.55);--base:radial-gradient(circle at 35% 30%,#a8ddff,#4a86e6 42%,#2855b9 82%);
  --tex:radial-gradient(14% 18% at 12% 40%,#5cc98a,transparent 70%),radial-gradient(10% 15% at 30% 66%,#4fb87c,transparent 70%),radial-gradient(18% 9% at 40% 26%,rgba(255,255,255,.7),transparent 70%),radial-gradient(14% 18% at 62% 40%,#5cc98a,transparent 70%),radial-gradient(10% 15% at 80% 66%,#4fb87c,transparent 70%),radial-gradient(18% 9% at 90% 26%,rgba(255,255,255,.7),transparent 70%)}
.sph.moon{--atm:rgba(225,228,240,.28);--base:radial-gradient(circle at 35% 30%,#f1f1f5,#b7b9c6 45%,#6f7282 85%);
  --tex:radial-gradient(7% 8% at 10% 35%,#8f92a2,transparent 75%),radial-gradient(5% 6% at 24% 62%,#9698a7,transparent 75%),radial-gradient(9% 9% at 36% 30%,#a0a2b0,transparent 75%),radial-gradient(4% 5% at 44% 70%,#8a8c9c,transparent 75%),radial-gradient(7% 8% at 60% 35%,#8f92a2,transparent 75%),radial-gradient(5% 6% at 74% 62%,#9698a7,transparent 75%),radial-gradient(9% 9% at 86% 30%,#a0a2b0,transparent 75%),radial-gradient(4% 5% at 94% 70%,#8a8c9c,transparent 75%)}
.sph.mars{--atm:rgba(255,170,130,.42);--base:radial-gradient(circle at 35% 30%,#ffc59a,#d8693a 45%,#7a2c16 86%);
  --tex:radial-gradient(16% 10% at 14% 45%,#a9472a,transparent 70%),radial-gradient(9% 12% at 32% 66%,#b95634,transparent 70%),radial-gradient(12% 7% at 40% 34%,#9a3f22,transparent 70%),radial-gradient(16% 10% at 64% 45%,#a9472a,transparent 70%),radial-gradient(9% 12% at 82% 66%,#b95634,transparent 70%),radial-gradient(12% 7% at 90% 34%,#9a3f22,transparent 70%)}
.oring{position:absolute;inset:4px;transform-style:preserve-3d;transform:rotateZ(-16deg) rotateX(74deg)}
.oring.r2{inset:10px;transform:rotateZ(22deg) rotateX(70deg)}
.ospin{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(132,227,213,.6);transform-style:preserve-3d;animation:ospin 5s linear infinite}
.ospin .sat{position:absolute;left:50%;top:-8px;width:16px;height:16px;margin-left:-8px;transform-style:preserve-3d;animation:osat 5s linear infinite}
.ospin .sat::before{content:"";position:absolute;inset:4px;border-radius:2px;background:#f2c878;box-shadow:0 0 10px #fff,0 0 18px rgba(132,227,213,.9)}
.ospin .sat::after{content:"";position:absolute;left:-7px;right:-7px;top:6px;height:4px;background:#6f8dff;border-radius:1px}
@keyframes ospin{to{transform:rotateZ(360deg)}}
@keyframes osat{from{transform:rotateZ(0) rotateX(-74deg)}to{transform:rotateZ(-360deg) rotateX(-74deg)}}
/* CubeSat: cubo 3D real */
.cube{position:absolute;left:50%;top:50%;width:54px;height:104px;margin:-52px 0 0 -27px;transform-style:preserve-3d;animation:cubespin 10s linear infinite}
.cf{position:absolute;left:0;top:0;width:54px;height:104px;border:3px solid #d7dcea;border-radius:3px;
  background:repeating-linear-gradient(0deg,#3d5fd0 0 30px,#d7dcea 30px 34px),#3d5fd0;box-shadow:inset 0 0 14px rgba(255,255,255,.25)}
.cf::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 45%)}
.cf.f1{transform:translateZ(27px)} .cf.f2{transform:rotateY(180deg) translateZ(27px)} .cf.f3{transform:rotateY(90deg) translateZ(27px)} .cf.f4{transform:rotateY(-90deg) translateZ(27px)}
.cf.f5,.cf.f6{height:54px;top:25px;background:#c9cfdf;border-color:#e4e8f2}
.cf.f5{transform:rotateX(90deg) translateZ(52px)} .cf.f6{transform:rotateX(-90deg) translateZ(52px)}
.cf.f5::before{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;background:#fff;box-shadow:0 0 0 0 #fff}
@keyframes cubespin{from{transform:rotateX(-16deg) rotateY(0)}to{transform:rotateX(-16deg) rotateY(360deg)}}
/* Telescopio: espejo hexagonal dorado con parasol */
.tele{position:absolute;inset:0;transform-style:preserve-3d;animation:telesway 7s ease-in-out infinite alternate}
@keyframes telesway{from{transform:rotateY(-38deg) rotateX(8deg)}to{transform:rotateY(38deg) rotateX(-4deg)}}
.tele .shield{position:absolute;left:-6px;right:-6px;top:86px;height:70px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  background:linear-gradient(135deg,#ffd2c2,#c4b4ff 60%,#8f86d6);transform:translateZ(-26px) rotateX(64deg);opacity:.95}
.tele .mirror{position:absolute;left:33px;top:20px;width:84px;height:96px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(90,58,0,.55) 26px 28px),repeating-linear-gradient(30deg,transparent 0 26px,rgba(90,58,0,.45) 26px 28px),repeating-linear-gradient(150deg,transparent 0 26px,rgba(90,58,0,.45) 26px 28px),radial-gradient(circle at 34% 30%,#fff6c6,#f0c254 45%,#9a6a16);
  box-shadow:0 0 30px rgba(242,200,120,.5)}
.tele .sec{position:absolute;left:69px;top:58px;width:12px;height:12px;border-radius:50%;background:#f7dd8a;box-shadow:0 0 12px #fff2b8;transform:translateZ(46px)}
.tele .strut{position:absolute;left:74px;top:30px;width:2px;height:48px;background:rgba(220,225,240,.8);transform-origin:50% 100%;transform:translateZ(23px) rotateX(-62deg)}

/* Transición de despegue: zoom hacia la misión */
.start.warp .hero,.start.warp .sec-mode,.start.warp .sec-diff,.start.warp .start-actions,.start.warp .car-info,.start.warp .car-arrow,.start.warp .car-dots,.start.warp .car-floor,.start.warp .credits{opacity:0;transform:scale(.94);transition:opacity .45s,transform .6s}
.start.warp .car-item:not(.sel){opacity:0!important;transition:opacity .35s}
.start.warp .car-item.sel .obj{transform:scale(9);opacity:0}
.start.warp .car-item.sel .car-name{opacity:0}

/* ---------- Fase 4: nave 3D girable ---------- */
.sc3d{display:block;width:100%;height:300px;cursor:grab;touch-action:pan-y}
.sc3d.dragging{cursor:grabbing}
.holo-hud{position:absolute;left:14px;top:10px;z-index:1;font-size:.8rem;font-weight:700;color:var(--cyan);pointer-events:none;text-shadow:0 1px 6px rgba(6,10,30,.8)}
.holo-tip{position:absolute;right:12px;top:10px;z-index:1;font-size:.72rem;color:var(--muted);pointer-events:none;background:rgba(37,53,118,.6);padding:3px 9px;border-radius:999px}
.holo-legend{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:3px 12px;padding:4px 14px 12px;font-size:.74rem;color:var(--muted)}
.holo-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.orbit3d{cursor:grab;touch-action:pan-y} .orbit3d.dragging{cursor:grabbing}
@media (max-width:600px){.sc3d{height:250px}.car-stage{height:236px}.car-floor{top:100px}.obj{transform:scale(.82)}.medal{width:calc(50% - 10px);min-width:150px}.pod{width:calc(33% - 12px);min-width:104px;padding:12px 4px}.pod-fig span{font-size:2.4rem}.pod-fig.many span{font-size:1.9rem}.pod .tsub{display:none}.mlist,.mlist b{font-size:.68rem}.mface{padding-left:9px;padding-right:9px}}
/* ---------- Inicio estilo “menú de juego” ---------- */
.start .hero{padding:14px 8px 0}
.start .hero h1{font-size:clamp(2.1rem,5.2vw,3.6rem)}
.start .hero .tag{margin:.4em 0 0;font-size:1.05rem}
.start .sec-mission{margin-top:16px}
@media (min-width:700px){.car-stage{height:262px}.car-item .obj{transform:scale(1.22)}.car-item .car-name{margin-top:22px;font-size:1rem}.car-floor{top:150px;width:700px}.car-arrow{top:112px}}
.sel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:1120px;margin:22px auto 0}
@media (max-width:860px){.sel-grid{grid-template-columns:minmax(0,1fr)}}
.sel-panel{position:relative;padding:14px 10px 14px;border-radius:26px;background:linear-gradient(170deg,rgba(70,93,171,.45),rgba(44,61,130,.55));border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 18px 40px rgba(6,10,30,.3);text-align:center}
.sel-h{font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 4px}
.sel-h b{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--grad);color:#1f2951;box-shadow:0 3px 0 #6d63b3;margin-right:6px}
.sel-cap{min-height:2.6em;margin:6px 8px 0;font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:2px}
.pick-row{display:flex;justify-content:center;gap:4px}
.pick{--rx:0deg;--ry:0deg;--mx:50%;--my:50%;--lift:0px;position:relative;flex:1 1 0;min-width:0;max-width:176px;padding:4px 2px 8px;background:none;border:0;border-radius:20px;color:var(--text);cursor:pointer;
  transform:perspective(700px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--lift));transition:transform .3s,opacity .35s,filter .35s;opacity:.58;filter:saturate(.65)}
.pick:hover{--lift:-5px;opacity:.95;filter:none}
.pick.sel{opacity:1;filter:none}
.pick:focus-visible{outline-offset:-2px}
.pick .mini{--ms:1;position:relative;display:block;width:124px;height:124px;margin:0 auto;transform:scale(var(--ms));transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.pick.sel .mini{transform:scale(calc(var(--ms) * 1.14)) translateY(-8px)}
.pick .flo{position:absolute;inset:0;display:block;transform-style:preserve-3d;perspective:520px;animation:floaty 3.4s ease-in-out infinite}
.pick:nth-child(2) .flo{animation-delay:-1.1s}.pick:nth-child(3) .flo{animation-delay:-2.2s}
.pedestal{position:relative;display:block;width:100px;height:22px;margin:-12px auto 8px;border-radius:50%;background:radial-gradient(closest-side,rgba(132,227,213,.3),transparent);border:1.5px dashed rgba(132,227,213,.3);transition:.4s}
.pick.sel .pedestal{background:radial-gradient(closest-side,rgba(132,227,213,.85),rgba(184,166,255,.3) 70%,transparent);border:1.5px solid rgba(132,227,213,.9);box-shadow:0 0 24px rgba(132,227,213,.6);animation:basepulse2 2.2s ease-in-out infinite}
@keyframes basepulse2{0%,100%{box-shadow:0 0 18px rgba(132,227,213,.45)}50%{box-shadow:0 0 34px rgba(132,227,213,.85)}}
.beam{position:absolute;left:50%;top:18px;width:110px;height:122px;margin-left:-55px;background:linear-gradient(to top,rgba(132,227,213,.32),rgba(184,166,255,.06) 70%,transparent);clip-path:polygon(24% 100%,76% 100%,100% 0,0 0);opacity:0;transition:opacity .45s;pointer-events:none}
.pick.sel .beam{opacity:1}
.pn{display:block;font-weight:800;font-size:.95rem;line-height:1.2}
.ps{display:block;font-size:.74rem;color:var(--muted);min-height:1.2em}
.pick .stars{font-size:.9rem}
/* cubo genérico */
.cb{position:absolute;left:calc(var(--s) / -2);top:calc(var(--s) / -2);width:var(--s);height:var(--s);transform-style:preserve-3d}
.cb>i{position:absolute;inset:0;background:var(--c);border:1px solid var(--e,rgba(255,255,255,.45))}
.cb>i:nth-child(1){transform:translateZ(calc(var(--s) / 2))}
.cb>i:nth-child(2){transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.cb>i:nth-child(3){transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}
.cb>i:nth-child(4){transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.cb>i:nth-child(5){transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}
.cb>i:nth-child(6){transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.cb.gold{--c:linear-gradient(135deg,#ffe7a8,#d9a441);--e:rgba(140,96,20,.6)}
.cb.gold>i:nth-child(3),.cb.gold>i:nth-child(4){filter:brightness(.82)} .cb.gold>i:nth-child(6){filter:brightness(.6)}
/* Un jugador: satélite que gira */
.o-sat{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;animation:satspin 9s linear infinite}
@keyframes satspin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.o-sat .wing{position:absolute;top:-12px;width:50px;height:24px;border:1.5px solid #cfd7f6;border-radius:2px;background:repeating-linear-gradient(90deg,#3d5fd0 0 11px,#cfd7f6 11px 12.5px),#3d5fd0;box-shadow:0 0 12px rgba(120,150,255,.35)}
.o-sat .wing.l{left:-70px} .o-sat .wing.r{left:20px}
.o-sat .wing::before{content:"";position:absolute;top:10px;width:6px;height:2px;background:#cfd7f6}
.o-sat .wing.l::before{right:-7px} .o-sat .wing.r::before{left:-7px}
.o-sat .dish{position:absolute;left:-11px;top:-40px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff,#c9cfdf 60%,#8f97b3);transform:rotateX(65deg);box-shadow:0 0 10px rgba(132,227,213,.6)}
/* Equipo: constelación */
.ospin .tri{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ospin .tri polygon{fill:rgba(132,227,213,.08);stroke:rgba(132,227,213,.75);stroke-width:1.4;stroke-dasharray:4 3}
.oring.t{inset:2px;transform:rotateZ(-14deg) rotateX(58deg)}.oring.t .ospin .sat{animation-name:osat2}
@keyframes osat2{from{transform:rotateZ(0) rotateX(-58deg)}to{transform:rotateZ(-360deg) rotateX(-58deg)}}
.ospin .sat.a{left:50%;top:-8px} .ospin .sat.b{left:93.3%;top:calc(75% - 8px)} .ospin .sat.c{left:6.7%;top:calc(75% - 8px)}
/* Sandbox: cubo holográfico */
.o-box{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;animation:boxspin 14s linear infinite}
@keyframes boxspin{from{transform:rotateX(0) rotateY(0)}to{transform:rotateX(360deg) rotateY(720deg)}}
.cb.wire{--c:linear-gradient(rgba(132,227,213,.45) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,rgba(132,227,213,.45) 1px,transparent 1px) 0 0/14px 14px,rgba(132,227,213,.07);--e:rgba(132,227,213,.9)}
.cb.wire>i{border-width:2px;box-shadow:inset 0 0 14px rgba(132,227,213,.35)}
.core{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b8a6ff 50%,#6d63b3);box-shadow:0 0 20px #b8a6ff,0 0 40px rgba(255,181,158,.4);animation:corepulse 2s ease-in-out infinite}
@keyframes corepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
/* Principiante: planeta verde con luna */
.sph.verde{--atm:rgba(125,223,138,.45);--base:radial-gradient(circle at 35% 30%,#d4ffe4,#5cc98a 45%,#1e6a50 86%);
  --tex:radial-gradient(14% 18% at 12% 40%,rgba(255,255,255,.35),transparent 70%),radial-gradient(10% 12% at 32% 70%,#3a9f6c,transparent 70%),radial-gradient(14% 18% at 62% 40%,rgba(255,255,255,.35),transparent 70%),radial-gradient(10% 12% at 82% 70%,#3a9f6c,transparent 70%)}
.ospin .sat.moonl::before{inset:3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b7b9c6 60%,#6f7282);box-shadow:0 0 8px rgba(255,255,255,.6)}
.ospin .sat.moonl::after{display:none}
/* Intermedio: planeta con anillos */
.o-saturn{position:absolute;inset:0;transform-style:preserve-3d;animation:wobble 6s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotateZ(-6deg) rotateY(-14deg)}50%{transform:rotateZ(6deg) rotateY(14deg)}}
.sph.saturn{--atm:rgba(255,210,150,.45);--base:radial-gradient(circle at 35% 30%,#fff2d6,#e8b878 45%,#94643a 86%);
  --tex:repeating-linear-gradient(0deg,transparent 0 9px,rgba(160,100,50,.28) 9px 13px)}
.pring{position:absolute;inset:4px;border-radius:50%;transform:rotateZ(-18deg) rotateX(76deg);
  background:radial-gradient(closest-side,transparent 58%,rgba(255,236,200,.95) 61%,rgba(232,190,140,.75) 70%,transparent 72%,rgba(200,180,255,.6) 75%,rgba(200,180,255,.35) 86%,transparent 88%)}
/* Experto: agujero negro */
.bh-disk{position:absolute;inset:2px;border-radius:50%;transform:rotateZ(-14deg) rotateX(74deg);transform-style:preserve-3d}
.bh-disk::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#ffd27a,#ff8092,#b8a6ff,#ffb36b,#fff1c4,#ff8092,#ffd27a);
  -webkit-mask:radial-gradient(closest-side,transparent 38%,#000 44%,#000 80%,transparent 100%);mask:radial-gradient(closest-side,transparent 38%,#000 44%,#000 80%,transparent 100%);animation:spin 2.6s linear infinite}
.bh-halo{position:absolute;inset:28px;border-radius:50%;background:radial-gradient(closest-side,transparent 64%,rgba(255,230,180,.95) 72%,rgba(255,128,146,.55) 84%,transparent 100%);animation:halo 2.4s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}
.bh-core{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle,#000 60%,#100818);box-shadow:0 0 0 2px rgba(255,236,200,.85),0 0 26px rgba(255,150,120,.75)}
.launch-btn{font-size:1.35rem;padding:16px 46px;min-height:62px;letter-spacing:.08em;font-weight:900}
.start-actions{margin:28px 0 22px}
@media (max-width:600px){.pick .mini{--ms:.76;margin:-14px auto -16px}.pedestal{width:76px}.beam{width:84px;margin-left:-42px;height:96px}.pn{font-size:.82rem}.ps{font-size:.68rem}.launch-btn{font-size:1.1rem;padding:14px 26px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- Impresión del informe ---------- */
@media print{
  body{background:#ffffff;color:#000000} body::before{display:none}
  #stars,.topbar,.track,.dash,.no-print,#toasts,.phase-nav{display:none!important}
  .layout{display:block}
  .panel,.rating,.seg,.stat{background:#ffffff!important;color:#000000;border:1px solid #999999;break-inside:avoid;box-shadow:none;backdrop-filter:none}
  .rating .big,.stat .sv{color:#000000;-webkit-text-fill-color:#000000;background:none}
  .muted,.dim{color:#333333!important}
  details{display:block} details>*{display:block}
  th{background:#eeeeee;color:#000000}
}

/* Aclarado general: cielo crepuscular más luminoso */
body{background:linear-gradient(180deg,#46559a 0%,#3c4a8a 50%,#33407a 100%) fixed}
body::before{background:radial-gradient(38% 34% at 18% 22%,rgba(200,180,255,.32),transparent 70%),radial-gradient(32% 30% at 82% 18%,rgba(255,190,170,.24),transparent 70%),radial-gradient(42% 38% at 72% 86%,rgba(140,235,220,.2),transparent 70%),radial-gradient(30% 30% at 12% 86%,rgba(150,175,255,.24),transparent 70%)}
.panel,.sel-panel,.car-info{border-color:rgba(220,228,255,.22)}
.card,.tile,.pick .pedestal{border-color:rgba(220,228,255,.2)}
.brand{font-size:1.05rem}
/* =====================================================================
   TEMA CLARO “CIELO DE DÍA” + MODO SIMPLE
   ===================================================================== */
:root{--text:#1f2a4d;--muted:#4b5679;--dim:#6b7598;--line:rgba(70,90,160,.16);--line2:rgba(70,90,160,.28);
  --glass:rgba(255,255,255,.66);--cyan:#1f9e93;--violet:#7b61ff;--pink:#ff7a59;--ok:#1f9d55;--warn:#c98a00;--bad:#e0405a;--gold:#e0a400;
  --gradtx:linear-gradient(120deg,#22a99c 0%,#7b61ff 50%,#ff7a59 100%);--card:#ffffff}
body{background:linear-gradient(180deg,#cfe0ff 0%,#e4ddff 55%,#ffe5da 100%) fixed;color:var(--text)}
body::before{background:radial-gradient(38% 34% at 18% 22%,rgba(255,255,255,.7),transparent 70%),radial-gradient(32% 30% at 82% 18%,rgba(255,214,200,.55),transparent 70%),radial-gradient(42% 38% at 72% 86%,rgba(170,240,230,.5),transparent 70%),radial-gradient(30% 30% at 12% 86%,rgba(200,190,255,.55),transparent 70%)}
#stars{opacity:.35}
.topbar{background:rgba(255,255,255,.78);border-bottom:1px solid var(--line)}
.brand,.brand b{color:var(--text)}
.brand b{background:var(--gradtx);-webkit-background-clip:text;background-clip:text;color:transparent}
.gradtext{background:var(--gradtx);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:#fff;border-color:var(--line2);color:var(--text);box-shadow:0 3px 0 rgba(70,90,160,.25)}
.btn:hover{background:#f4f6ff;border-color:#7b61ff;box-shadow:0 5px 0 rgba(70,90,160,.22)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.7)}
.btn.danger{color:#c0304a}
.btn.primary{background:linear-gradient(120deg,#4fd1c5,#8b7bff 55%,#ff9a7a);background-size:200% 100%;color:#fff;text-shadow:0 1px 2px rgba(40,30,90,.35);box-shadow:0 5px 0 #5a4bc4,0 12px 24px rgba(123,97,255,.3)}
.btn.primary:hover{box-shadow:0 7px 0 #5a4bc4,0 16px 28px rgba(123,97,255,.35)}
.btn.primary:active{box-shadow:0 0 0 #5a4bc4}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #5a4bc4,0 0 0 0 rgba(123,97,255,.45)}50%{box-shadow:0 5px 0 #5a4bc4,0 0 0 14px rgba(123,97,255,0)}}
.chip{background:rgba(255,255,255,.8);border-color:var(--line2);color:var(--muted)}
.chip.acc{border-color:#22a99c;color:#178a7f}
.panel,.sel-panel,.car-info{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(70,80,160,.14),inset 0 1px 0 #fff}
.hero h1{text-shadow:none}
.hero h1 .gradtext{filter:drop-shadow(0 3px 0 rgba(90,75,196,.25)) drop-shadow(0 10px 18px rgba(90,75,196,.18))}
.hero .tag{color:var(--muted)}
.start-sec h2,.sel-h{color:var(--muted)}
.car-name{color:var(--text);text-shadow:0 1px 0 #fff}
.car-arrow{background:#fff;color:var(--text);border-color:var(--line2);box-shadow:0 4px 0 rgba(70,90,160,.25)}
.car-floor{background:radial-gradient(closest-side,rgba(123,97,255,.22),rgba(34,169,156,.1) 60%,transparent);border-color:rgba(123,97,255,.3)}
.car-dots i{background:rgba(70,90,160,.25)}
.car-info p{color:var(--muted)}
.pick{opacity:.6;filter:saturate(.75)}
.pick .pn{color:var(--text)} .pick .ps{color:var(--muted)}
.pedestal{background:radial-gradient(closest-side,rgba(123,97,255,.22),transparent);border-color:rgba(123,97,255,.3)}
.pick.sel .pedestal{background:radial-gradient(closest-side,rgba(34,169,156,.7),rgba(123,97,255,.25) 70%,transparent);border-color:#22a99c;box-shadow:0 0 22px rgba(34,169,156,.45)}
.beam{background:linear-gradient(to top,rgba(34,169,156,.28),rgba(123,97,255,.06) 70%,transparent)}
.stars{color:#e0a400;text-shadow:none}
.credits{color:var(--dim)}
.modal-bg{background:rgba(60,70,130,.35)}
.modal{background:#fff;color:var(--text);border-color:var(--line2);box-shadow:0 30px 70px rgba(50,60,130,.3)}
.modal-h{background:#fff}
.formula{background:#f3f5ff;color:#2a3466;border-color:var(--line)}
.gloss dt{color:#178a7f} .gloss dd{color:var(--muted)}
.modal textarea,.modal input[type=text],.modal input[type=search]{background:#f6f7ff;color:var(--text)}
.toast{background:#fff;color:var(--text);border-color:#22a99c;box-shadow:0 10px 26px rgba(50,60,130,.2)}
.note{background:rgba(34,169,156,.08)} .q{color:#5a4bc4;border-color:rgba(123,97,255,.5);background:rgba(123,97,255,.08)}
table th{background:#eef1ff;color:var(--muted)}
.viz{border-color:rgba(255,255,255,.9);box-shadow:0 14px 34px rgba(70,80,160,.18)}

/* ---------- Taller ---------- */
.shop,.fly,.result{max-width:1180px;margin:0 auto;padding:14px 16px 40px}
.shop-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sh-title{display:flex;align-items:center;gap:10px}
.sh-ico{font-size:2.2rem;filter:drop-shadow(0 4px 6px rgba(70,80,160,.25))}
.sh-title h1{font-size:1.5rem;margin:0;font-weight:900}
.sh-title p{margin:0;color:var(--muted);font-size:.9rem}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px;min-height:64px}
.bars-wait{grid-column:1/-1;display:grid;place-items:center;text-align:center;padding:12px;border-radius:18px;background:rgba(255,255,255,.55);border:2px dashed rgba(123,97,255,.3);color:var(--muted)}
.bar{padding:10px 12px;border-radius:18px;background:#fff;border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 20px rgba(70,80,160,.12),0 4px 0 rgba(70,90,160,.12);animation:rise .4s both}
.bh{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.bh .bi{font-size:1.3rem} .bh b{font-size:.95rem} .bh .bval{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--muted);text-align:right}
.mtrack{height:12px;border-radius:12px;background:#eceffb;overflow:hidden}
.mtrack>span{display:block;height:100%;border-radius:12px;transition:width 1s cubic-bezier(.2,.8,.2,1),background .3s}
.bar.ok .mtrack>span{background:linear-gradient(90deg,#5fd39a,#22a99c)} .bar.warn .mtrack>span{background:linear-gradient(90deg,#ffd27a,#f0a500)} .bar.bad .mtrack>span{background:linear-gradient(90deg,#ff9aa8,#e0405a)}
.bar.bad{box-shadow:0 0 0 2px rgba(224,64,90,.45),0 8px 20px rgba(224,64,90,.18)} .bar.bad .bval{color:#c0304a}
.bar.warn .bval{color:#a87300}
.shop-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.pcol{display:flex;flex-direction:column;gap:14px}
.piece{padding:12px;border-radius:20px;background:rgba(255,255,255,.78);border:2px solid rgba(255,255,255,.95);box-shadow:0 10px 24px rgba(70,80,160,.13);transition:border-color .3s,box-shadow .3s}
.piece.done{border-color:rgba(34,169,156,.45)}
.piece.bad{border-color:rgba(224,64,90,.6);box-shadow:0 0 0 3px rgba(224,64,90,.15),0 10px 24px rgba(224,64,90,.15)}
.pc-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pc-ico{font-size:1.8rem;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(160deg,#eef2ff,#e3f7f4)}
.pc-h b{display:block;font-size:1rem} .pc-h small{display:block;color:var(--muted);font-size:.78rem;line-height:1.25}
.pc-ok{margin-left:auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:#22a99c;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.piece.done .pc-ok{transform:scale(1)} .piece.bad .pc-ok{background:#e0405a}
.pc-opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 9px;border-radius:14px;border:2px solid #e3e7f6;background:#fff;cursor:pointer;color:var(--text);box-shadow:0 3px 0 #dfe3f3;transition:transform .15s,border-color .2s,box-shadow .2s}
.opt:hover{transform:translateY(-2px);border-color:#b9adff}
.opt:active{transform:translateY(2px);box-shadow:none}
.opt.sel{border-color:#7b61ff;background:linear-gradient(170deg,#f3f0ff,#e9fbf8);box-shadow:0 3px 0 #7b61ff,0 0 0 3px rgba(123,97,255,.15)}
.sz{height:26px;display:flex;align-items:center;justify-content:center}
.sz i{display:block;border-radius:50%;background:linear-gradient(135deg,#8b7bff,#4fd1c5)}
.sz .z0{width:10px;height:10px} .sz .z1{width:17px;height:17px} .sz .z2{width:25px;height:25px}
.opt-t{font-weight:800;font-size:.8rem}
.opt-n{font-size:.68rem;color:var(--muted);text-align:center;line-height:1.2;min-height:2.4em}
.shop .holo{min-height:340px;border:2px solid rgba(255,255,255,.95);background:radial-gradient(ellipse at 50% 40%,#ffffff,#e7ecff 60%,#d9dcff);box-shadow:0 14px 34px rgba(70,80,160,.18)}
.shop .holo::after{background:repeating-linear-gradient(0deg,rgba(123,97,255,.04) 0 2px,transparent 2px 6px)}
.shop .holo-hud,.shop .holo-legend{display:none}
.shop .holo-tip{background:rgba(255,255,255,.85);color:var(--muted)}
.shop .sc3d{height:340px}
.go-zone{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}
.mc{flex:1;min-width:260px;padding:12px 16px;border-radius:18px;background:rgba(255,255,255,.75);border:2px solid #fff;box-shadow:0 8px 20px rgba(70,80,160,.12)}
.mc ul{margin:6px 0 0;padding-left:20px;font-size:.92rem} .mc li{margin:3px 0}
