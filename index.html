const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const sum = (arr, k) => arr.reduce((a, o) => a + (o ? (o[k] || 0) : 0), 0);
const deepClone = o => JSON.parse(JSON.stringify(o));
function fmt(x, dec = 1) {
  if (x == null || Number.isNaN(x)) return '—';
  if (!isFinite(x)) return '∞';
  return Number(x).toLocaleString('es-ES', { minimumFractionDigits: 0, maximumFractionDigits: dec });
}
const autoDec = x => { const a = Math.abs(x); return a < 1 ? 3 : a < 10 ? 2 : a < 100 ? 1 : 0; };
const fmtM = x => fmt(x, Math.abs(x) < 1 ? 2 : Math.abs(x) < 10 ? 2 : Math.abs(x) < 100 ? 1 : 0) + ' M$';
const fmtKg = x => fmt(x, Math.abs(x) < 10 ? 2 : Math.abs(x) < 200 ? 1 : 0) + ' kg';
const fmtW = x => fmt(x, Math.abs(x) < 20 ? 1 : 0) + ' W';
const fmtGB = x => fmt(x, autoDec(x)) + ' GB/día';
const pct = (x, d = 0) => isFinite(x) ? fmt(x * 100, d) + ' %' : '—';
const fmtYears = y => !isFinite(y) ? 'ilimitada' : (y >= 50 ? 'más de 50 años' : fmt(y, y < 3 ? 1 : 0) + (Math.abs(y - 1) < 0.05 ? ' año' : ' años'));
const sgn = (x, f) => (x > 0 ? '+' : (x < 0 ? '−' : '±')) + f(Math.abs(x));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const tagName = t => TAGS[t] || t;
function fmtDelay(s) { if (s < 1) return fmt(s * 1000, 0) + ' ms'; if (s < 60) return fmt(s, 1) + ' s'; return fmt(s / 60, 1) + ' min'; }
// Generador pseudoaleatorio con semilla (para simulaciones repetibles)
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const newSeed = () => Math.floor(Math.random() * 900000) + 100000;
// Puntuación por “banda”: 1 dentro de [lo,hi], cae linealmente a 0 en zLo y zHi
function band(x, lo, hi, zLo, zHi) {
  if (!isFinite(x)) return 0;
  if (x >= lo && x <= hi) return 1;
  if (x < lo) return clamp((x - zLo) / (lo - zLo));
  return clamp((zHi - x) / (zHi - hi));
}
function tierName(t) { return t >= 3 ? 'Experto' : t === 2 ? 'Intermedio o superior' : 'Principiante'; }

   19. MODELO DE CÁLCULO
   ===================================================================== */
// Geometría orbital: periodo (Kepler), eclipse, contacto, Δv de mantenimiento y caída orbital
function orbitGeometry(orbit, alt, st) {
  const body = PHYS.BODIES[orbit.body];
  const g = { body };
  if (orbit.special === 'l2') {
    g.alt = 1.5e6; g.a = null; g.periodS = 182 * 86400; g.eclFrac = 0; g.eclH = 0;
  } else if (orbit.peri != null) {
    g.rp = body.R + orbit.peri; g.ra = body.R + orbit.apo; g.a = (g.rp + g.ra) / 2; g.alt = (orbit.peri + orbit.apo) / 2;
    g.e = (g.ra - g.rp) / (g.ra + g.rp);
    g.periodS = 2 * Math.PI * Math.sqrt(g.a ** 3 / body.mu);
    g.eclFrac = orbit.eclipseFrac; g.eclH = orbit.eclipseMaxH;
  } else {
    const h = orbit.alt.fixed != null ? orbit.alt.fixed : clamp(alt == null ? orbit.alt.def : +alt, orbit.alt.min, orbit.alt.max);
    g.alt = h; g.a = body.R + h; g.rp = g.ra = g.a; g.e = 0;
    g.periodS = 2 * Math.PI * Math.sqrt(g.a ** 3 / body.mu);
    if (orbit.eclipseFrac != null) { g.eclFrac = orbit.eclipseFrac; g.eclH = orbit.eclipseMaxH; }
    else { g.eclFrac = Math.asin(body.R / g.a) / Math.PI * (orbit.eclipseFactor || 1); g.eclH = g.eclFrac * g.periodS / 3600; }
  }
  g.periodMin = g.periodS / 60;
  g.contactPerStation = orbit.contactRef ? Math.max(5, orbit.contactRef.base + orbit.contactRef.slope * (g.alt - orbit.contactRef.alt)) : orbit.contactPerStation;
  g.dvPerYear = orbit.drag ? 0.05 * Math.exp(-(g.alt - 400) / 80) : (orbit.dvPerYear || 0);
  g.decayYears = orbit.drag ? Math.exp((g.alt - 400) / 70) * (st && st.size <= 1 ? 1 : 3) : Infinity;
  return g;
}
// Minutos de contacto diarios con el segmento terrestre (con solape entre estaciones en órbita baja)
function contactMinutes(orbit, g, gnd) {
  const per = g.contactPerStation;
  let total = orbit.rangeClass === 0 ? per * (1 - Math.pow(0.85, gnd.stations)) / 0.15 : per * gnd.stations;
  total = Math.min(total, 1440, gnd.maxContact || 1440);
  return total * (1 - (orbit.occultation || 0));
}
function launchSuccessProb(L, diff) { return 1 - (1 - L.rel) * (diff ? diff.launchRisk : 1); }

// Cálculo completo de un diseño → objeto con todas las métricas
function computeMetrics(d) {
  const sc = SCENARIOS[d.scenarioId], diff = DIFFICULTIES[d.difficulty] || DIFFICULTIES.beginner, sandbox = d.mode === 'sandbox';
  const obj = sc.objectives.find(o => o.id === d.objectiveId) || sc.objectives[0];
  const orbit = ORBITS[d.orbit], body = PHYS.BODIES[orbit.body], st = STRUCTURES[d.structure];
  const L = d.launcher ? LAUNCHERS[d.launcher] : null;
  const sp = SOLAR[d.solar], bat = BATTERIES[d.battery], obc = OBCS[d.obc], prop = PROPULSION[d.propulsion];
  const th = THERMAL[d.thermal], sh = SHIELDING[d.shielding], comm = COMMS[d.comms], gnd = GROUND[d.ground];
  const instr = d.instruments.map(id => INSTRUMENTS[id]).filter(Boolean);
  const adcs = d.adcs.map(id => ADCS[id]).filter(Boolean);
  const years = d.durationYears, isCube = st.size <= 1;
  const m = { d, sc, obj, orbit, body, st, L, sp, bat, obc, prop, th, sh, comm, gnd, instr, adcs, years, diff, sandbox, isCube };
  const g = m.geo = orbitGeometry(orbit, d.altitude, st);

  /* --- Comunicaciones y datos --- */
  m.contactMin = contactMinutes(orbit, g, gnd);
  m.linkRangeOK = comm.maxRange >= orbit.rangeClass;
  m.groundRangeOK = gnd.maxRange >= orbit.rangeClass;
  m.linkOK = m.linkRangeOK && m.groundRangeOK;
  m.rateMbps = m.linkOK ? Math.min(comm.rate, comm.rate * orbit.linkFactor * comm.gain * gnd.gain) : 0;
  m.downGB = m.rateMbps * m.contactMin * 60 / 8000;   // Mbps × s → Mb ; /8 → MB ; /1000 → GB
  m.genGB = sum(instr, 'data');
  m.dataFrac = m.genGB > 0 ? Math.min(1, m.downGB / m.genGB) : 1;
  m.lostGB = Math.max(0, m.genGB - m.downGB);
  m.commDuty = Math.max(0.1, m.contactMin / 1440);

  /* --- Masa --- */
  const busItems = [sp, bat, obc, comm, ...adcs];
  const busMass = sum(busItems, 'mass') + prop.dryMass;
  m.busMass = busMass;
  m.instrMass = sum(instr, 'mass');
  m.compMass = st.mass + busMass + m.instrMass;
  m.redMass = d.redundancy ? 0.12 * busMass : 0;
  m.thermalMass = th.massFrac * m.compMass;
  m.shieldMass = sh.massFrac * m.compMass;
  m.dryNoMargin = m.compMass + m.redMass + m.thermalMass + m.shieldMass;
  m.marginPct = diff.massMargin;
  m.marginMass = m.dryNoMargin * diff.massMargin;
  m.dry = m.dryNoMargin + m.marginMass;

  /* --- Δv y combustible (Tsiolkovsky) --- */
  m.dvSC = orbit.dvSpacecraft || 0;
  m.dvKeepYear = g.dvPerYear;
  m.dvDeorbit = (orbit.drag && prop.id !== 'none') ? Math.max(0.05, 0.0003 * (g.alt - 200)) : 0;
  m.dvTotal = m.dvSC + m.dvKeepYear * years + m.dvDeorbit;   // km/s
  if (prop.id === 'none') { m.propMass = 0; m.propNeeded = 0; m.propOK = m.dvSC <= 0; m.dvAvail = 0; m.ve = 0; }
  else {
    m.ve = prop.isp * PHYS.G0;                                 // m/s
    m.propNeeded = m.dry * (Math.exp(m.dvTotal * 1000 / m.ve) - 1);
    m.propMass = m.propNeeded * 1.1;                           // +10 % de reserva
    m.propOK = m.propMass <= prop.maxProp;
    m.dvAvail = m.ve * Math.log((m.dry + m.propMass) / m.dry) / 1000;
  }
  m.wet = m.dry + m.propMass;

  /* --- Lanzador --- */
  m.capacity = 0; m.launchCost = 0; m.launcherReach = false; m.rideshareAltOK = true; m.rideshareSizeOK = true;
  if (L) {
    let cap = L.cap[orbit.launcherClass] || 0;
    if (L.rideshare) cap = cap ? Math.min(cap, L.maxMass) : 0;
    else if (orbit.drag) cap *= (1 - (g.alt - 400) * 0.0005);
    m.capacity = cap; m.launcherReach = cap > 0;
    m.launchCost = L.costPerKg ? Math.max(L.minCost, L.costPerKg * m.wet) : L.cost;
    m.rideshareAltOK = !L.rideshare || (g.alt >= L.altWindow[0] && g.alt <= L.altWindow[1]);
    m.rideshareSizeOK = !L.rideshare || st.size <= L.maxSize;
  }
  m.massUse = m.capacity > 0 ? m.wet / m.capacity : Infinity;
  m.massMargin = m.capacity > 0 ? (m.capacity - m.wet) / m.capacity : -1;
  // En viaje compartido se paga por kg: la eficiencia se mide contra el límite de la estructura
  m.massUseEff = L && L.rideshare ? m.wet / (st.maxTotalMass || L.maxMass) : m.massUse;

  /* --- Energía --- */
  m.flux = body.solar;
  m.genSun = sp.area * sp.eff * m.flux * sp.pointing;       // W con luz solar
  m.genAvg = m.genSun * (1 - g.eclFrac);                     // W promedio en la órbita
  m.busPower = st.basePower + obc.power + sum(adcs, 'power') + prop.power + comm.power * m.commDuty;
  m.instrPower = sum(instr, 'power');
  m.thermalPower = th.powerFrac * (m.busPower + m.instrPower);
  m.cons = m.busPower + m.instrPower + m.thermalPower;
  m.powerMargin = m.cons > 0 ? (m.genAvg - m.cons) / m.cons : 1;
  m.dod = diff.dod;
  m.eclHcalc = Math.max(g.eclH, 0.5);                        // mínimo 30 min (lanzamiento / modo seguro)
  m.batReq = m.cons * m.eclHcalc / m.dod;
  m.batOK = bat.wh >= m.batReq;

  /* --- Control de actitud y apuntado --- */
  const hasMtqAny = adcs.some(a => a.kind === 'mtq');
  const hasMtq = hasMtqAny && orbit.magField;
  const hasRW = adcs.some(a => a.kind === 'rw'), hasST = adcs.some(a => a.kind === 'st');
  let pt = 15;
  if (hasMtq) pt = 5;
  if (hasST && !hasRW) pt = Math.min(pt, 2);
  if (hasRW) pt = isCube ? 1 : 0.5;
  if (hasRW && hasST) pt = isCube ? 0.02 : 0.002;
  Object.assign(m, { pointing: pt, hasRW, hasST, hasMtq, mtqUseless: hasMtqAny && !orbit.magField });
  m.momentumOK = !hasRW || hasMtq || prop.id !== 'none';

  /* --- Térmico --- */
  m.powerDensity = m.dry > 0 ? m.cons / m.dry : 0;
  m.thermalRatio = m.powerDensity / th.maxDensity;
  m.thermalOK = m.thermalRatio <= 1;
  m.coldOK = !orbit.cold || th.coldOK;
  m.needsCryo = instr.some(i => i.cool);
  m.cryoOK = !m.needsCryo || th.cryo;

  /* --- Radiación y vida útil --- */
  m.radTol = obc.radTol + sh.radBonus;
  m.radDiff = orbit.radiation - m.radTol;
  m.radLife = Math.min(30, 8 * Math.pow(2, m.radTol - orbit.radiation));
  m.degr = 0.015 + 0.005 * Math.max(0, orbit.radiation - 1 - sh.radBonus);
  m.powerLife = m.genAvg > m.cons ? Math.log(m.cons / m.genAvg) / Math.log(1 - m.degr) : 0;
  if (prop.id === 'none') m.propLife = orbit.drag ? g.decayYears : (g.dvPerYear > 0 ? (orbit.noPropLife == null ? Infinity : orbit.noPropLife) : Infinity);
  else { const keep = m.dvAvail - m.dvSC - m.dvDeorbit; m.propLife = g.dvPerYear > 0 ? Math.max(0, keep) / g.dvPerYear : Infinity; }
  m.cruiseMonths = Math.round((orbit.cruiseMonths || 0) + (prop.lowThrust && m.dvSC > 0.3 ? m.dvSC * 8 : 0));
  const propText = prop.id === 'none' ? (orbit.drag ? 'la caída de la órbita por rozamiento con la atmósfera' : 'la inestabilidad de la órbita sin propulsión para corregirla') : 'el agotamiento del combustible';
  m.lifeLimits = [
    { k: 'power', v: m.powerLife, t: 'la degradación de los paneles solares (energía)' },
    { k: 'prop', v: m.propLife, t: propText },
    { k: 'rad', v: m.radLife, t: 'la dosis acumulada de radiación en la electrónica' }
  ].sort((a, b) => a.v - b.v);
  m.lifeLimit = m.lifeLimits[0];
  m.lifeYears = m.lifeLimit.v;
  m.lifeCutYears = Math.min(m.propLife, m.radLife);
  m.opYearsEst = Math.min(years, m.lifeYears);
  m.debrisWarn = orbit.drag && prop.id === 'none' && g.decayYears > 25;

  /* --- Fiabilidad --- */
  const crit = [{ r: st.rel, red: false }, { r: obc.rel }, { r: sp.rel }, { r: bat.rel }, { r: comm.rel }];
  adcs.filter(a => a.kind === 'rw').forEach(a => crit.push({ r: a.rel }));
  if (prop.id !== 'none') crit.push({ r: prop.rel });
  const yf = Math.max(0.5, years) / 3;
  m.relComp = crit.reduce((acc, c) => acc * Math.pow((d.redundancy && c.red !== false) ? 1 - (1 - c.r) ** 2 : c.r, yf), 1);
  m.relRad = m.radDiff > 0 ? Math.pow(0.95, m.radDiff) : 1;
  m.relLaunch = L ? launchSuccessProb(L, diff) : 0.95;
  m.reliability = m.relLaunch * m.relComp * m.relRad;

  /* --- Valor científico --- */
  const ob = obj.orbitBonus[d.orbit] == null ? 0.7 : obj.orbitBonus[d.orbit];
  m.orbitBonus = ob;
  const vals = instr.map(i => {
    const relv = Math.max(0.3, ...i.tags.map(t => obj.weights[t] || 0));
    const pf = pt <= i.point ? 1 : Math.max(0.2, Math.sqrt(i.point / pt));
    const cf = i.cool && !th.cryo ? 0.1 : 1;
    const nf = i.needsTag && !instr.some(o => o !== i && o.tags.includes(i.needsTag)) ? 0.2 : 1;
    return { i, relv, pf, cf, nf, base: i.sci * relv * ob * pf * cf * nf };
  }).sort((a, b) => b.base - a.base);
  const tagCount = {};
  vals.forEach(v => { const p = v.i.tags[0]; tagCount[p] = (tagCount[p] || 0) + 1; v.dim = tagCount[p] === 1 ? 1 : tagCount[p] === 2 ? 0.6 : 0.4; v.v = v.base * v.dim; });
  m.instrValues = vals;
  m.sciRate = vals.reduce((a, v) => a + v.v, 0);
  m.groupsMet = obj.required.map(gr => instr.some(i => i.tags.some(t => gr.includes(t))));
  m.reqFrac = m.groupsMet.filter(Boolean).length / obj.required.length;
  m.compliance = 0.4 + 0.6 * m.reqFrac;
  m.durFactor = Math.min(1.5, m.opYearsEst / sc.targetYears);
  m.science = m.sciRate * m.dataFrac * m.compliance * m.durFactor;

  /* --- Presupuesto --- */
  const busCost = sum(busItems, 'cost') + prop.cost;
  m.instrCost = sum(instr, 'cost');
  m.compCost = st.cost + busCost + m.instrCost;
  m.redCost = d.redundancy ? 0.2 * busCost : 0;
  m.thermalCost = th.costFrac * m.compCost;
  m.shieldCost = sh.costFrac * m.compCost;
  m.hardwareCost = m.compCost + m.redCost + m.thermalCost + m.shieldCost;
  m.aitCost = PHYS.AIT * m.hardwareCost;
  m.devCost = m.hardwareCost + m.aitCost;
  m.groundCap = gnd.cost * sc.groundScale;
  m.opsYear = sc.opsPerYear + gnd.opsYear * sc.groundScale;
  m.opsYearsBilled = years + m.cruiseMonths / 12;
  m.opsCost = m.opsYear * m.opsYearsBilled;
  m.totalCost = m.devCost + m.launchCost + m.groundCap + m.opsCost;
  m.budget = sc.budget * diff.budgetMult * (d.budgetBoost || 1);
  m.budgetUse = m.totalCost / m.budget;
  return m;
}

/* =====================================================================
   20. DISPONIBILIDAD Y SANEAMIENTO DEL DISEÑO
   ===================================================================== */
function maxTierOf(d) { return d.mode === 'sandbox' ? 9 : (DIFFICULTIES[d.difficulty] || DIFFICULTIES.beginner).maxTier; }
// Devuelve null si el elemento está disponible, o un texto con el motivo si no
function unavailableReason(item, d, kind) {
  const st = STRUCTURES[d.structure], sc = SCENARIOS[d.scenarioId];
  if ((item.tier || 1) > maxTierOf(d)) return 'Disponible en dificultad ' + tierName(item.tier);
  if (item.only && !item.only.includes(d.scenarioId)) return 'No aplica a este escenario';
  if (kind === 'structure') { if (!sc.structures.includes(item.id)) return 'No adecuado para este escenario'; return null; }
  if (kind === 'orbit') { if (!sc.orbits.includes(item.id)) return 'No aplica a este escenario'; return null; }
  if (kind === 'launcher') { if (item.rideshare && st && st.size > item.maxSize) return 'Solo para CubeSats y satélites pequeños'; return null; }
  if (item.size && st && (st.size < item.size[0] || st.size > item.size[1])) return st.size <= 1 ? 'Demasiado grande para un CubeSat' : (item.size[1] <= 1 ? 'Solo para CubeSats' : 'Necesita una estructura mayor');
  return null;
}
const firstAvail = (cat, d, kind) => Object.values(cat).find(x => !unavailableReason(x, d, kind));
function sanitizeDesign(d) {
  const changes = [];
  const sc = SCENARIOS[d.scenarioId];
  if (!sc.objectives.some(o => o.id === d.objectiveId)) d.objectiveId = sc.objectives[0].id;
  if (!ORBITS[d.orbit] || unavailableReason(ORBITS[d.orbit], d, 'orbit')) { d.orbit = sc.orbits[0]; changes.push('órbita'); }
  const o = ORBITS[d.orbit];
  if (o.alt && o.alt.min != null) d.altitude = clamp(+d.altitude || o.alt.def, o.alt.min, o.alt.max); else d.altitude = o.alt && o.alt.fixed ? o.alt.fixed : null;
  if (!STRUCTURES[d.structure] || unavailableReason(STRUCTURES[d.structure], d, 'structure')) { d.structure = sc.structures.find(s => !unavailableReason(STRUCTURES[s], d, 'structure')); changes.push('estructura'); }
  const single = [['solar', SOLAR], ['battery', BATTERIES], ['obc', OBCS], ['comms', COMMS]];
  single.forEach(([k, cat]) => { if (!cat[d[k]] || unavailableReason(cat[d[k]], d)) { d[k] = firstAvail(cat, d).id; changes.push(k); } });
  if (!PROPULSION[d.propulsion] || unavailableReason(PROPULSION[d.propulsion], d)) { d.propulsion = 'none'; changes.push('propulsión'); }
  if (!THERMAL[d.thermal] || unavailableReason(THERMAL[d.thermal], d)) { d.thermal = 'th_passive'; changes.push('térmico'); }
  if (!SHIELDING[d.shielding]) d.shielding = 'none';
  if (!GROUND[d.ground]) d.ground = 'own1';
  const ad = (d.adcs || []).filter((id, i, a) => ADCS[id] && !unavailableReason(ADCS[id], d) && a.indexOf(id) === i);
  if (ad.length !== (d.adcs || []).length) {
    changes.push('control de actitud');
    // sustituir cada equipo incompatible por uno del mismo tipo que sí sea compatible
    (d.adcs || []).filter(id => ADCS[id] && unavailableReason(ADCS[id], d)).forEach(id => {
      const alt = Object.values(ADCS).find(x => x.kind === ADCS[id].kind && !unavailableReason(x, d));
      if (alt && !ad.includes(alt.id)) ad.push(alt.id);
    });
  }
  d.adcs = ad;
  const st = STRUCTURES[d.structure];
  let ins = (d.instruments || []).filter((id, i, a) => INSTRUMENTS[id] && !unavailableReason(INSTRUMENTS[id], d) && a.indexOf(id) === i);
  if (ins.length > st.maxInstr) ins = ins.slice(0, st.maxInstr);
  if (ins.length !== (d.instruments || []).length) changes.push('instrumentos');
  d.instruments = ins;
  if (d.launcher && (!LAUNCHERS[d.launcher] || unavailableReason(LAUNCHERS[d.launcher], d, 'launcher'))) { d.launcher = null; changes.push('lanzador'); }
  d.redundancy = !!d.redundancy;
  d.durationYears = clamp(Math.round((+d.durationYears || sc.targetYears) * 2) / 2, sc.durationRange[0], sc.durationRange[1]);
  return changes;
}
function newDesign(scenarioId, difficulty, mode) {
  const sc = SCENARIOS[scenarioId];
  const d = Object.assign(deepClone(sc.suggested), { scenarioId, objectiveId: sc.suggestedObjective || sc.objectives[0].id, difficulty, mode });
  if (difficulty !== 'beginner') { d.instruments = []; d.launcher = null; }
  sanitizeDesign(d);
  return d;
}

/* =====================================================================
   21. VERIFICACIÓN PREVIA AL LANZAMIENTO (checklist)
   status: ok | warn | fail | info · phase: fase donde se corrige
   ===================================================================== */
function runChecks(m, opts = {}) {
  const c = [];
  const add = (id, status, title, detail, phase) => c.push({ id, status, title, detail, phase });
  const sb = m.sandbox, em = m.diff.engMargin;
  // Requisitos científicos
  const missing = m.obj.required.filter((g, i) => !m.groupsMet[i]);
  if (!m.instr.length) add('req', 'fail', 'Instrumentos', 'Tu nave no lleva ningún instrumento: sin carga útil no hay misión. Añade al menos uno en la Fase 4.', 4);
  else if (missing.length) add('req', 'fail', 'Instrumentos requeridos', `El objetivo “${m.obj.name}” necesita al menos un instrumento de tipo: ${missing.map(g => g.map(tagName).join(' o ')).join('; ')}. Sin él no puede cumplir su propósito.`, 4);
  else add('req', 'ok', 'Instrumentos requeridos', 'Tienes instrumentos para cada requisito del objetivo.', 4);
  // Lanzador y masa
  if (!m.L) add('launch', 'fail', 'Lanzador', 'Aún no has elegido un lanzador.', 3);
  else if (!m.launcherReach) add('launch', 'fail', 'Lanzador', `${m.L.name} no puede llevar carga a ${LAUNCH_CLASS_NAMES[m.orbit.launcherClass]}. Elige otro lanzador.`, 3);
  else {
    const lim = m.capacity * (1 - em);
    if (m.wet > m.capacity) add('mass', sb ? 'info' : 'fail', 'Masa vs. lanzador', `Tu nave pesa ${fmtKg(m.wet)} y el lanzador solo lleva ${fmtKg(m.capacity)} a esa órbita: sobran ${fmtKg(m.wet - m.capacity)}. Quita masa (instrumentos, blindaje, combustible) o elige un lanzador mayor.${sb ? ' (Sandbox: se permite.)' : ''}`, 3);
    else if (m.wet > lim) add('mass', sb ? 'info' : 'fail', 'Margen de masa', `El nivel Experto exige ${pct(em)} de margen: la masa máxima es ${fmtKg(lim)} y tu nave pesa ${fmtKg(m.wet)}.`, 4);
    else if (m.massMargin < 0.05) add('mass', 'warn', 'Masa vs. lanzador', `Cabe, pero solo queda ${pct(m.massMargin, 1)} libre. Cualquier crecimiento del diseño lo dejaría fuera.`, 4);
    else add('mass', 'ok', 'Masa vs. lanzador', `${fmtKg(m.wet)} de ${fmtKg(m.capacity)} disponibles (${pct(m.massMargin)} libre).`, 3);
    if (!m.rideshareAltOK) add('ride', 'fail', 'Viaje compartido', `El viaje compartido solo deja satélites entre ${m.L.altWindow[0]} y ${m.L.altWindow[1]} km; tu órbita está a ${fmt(m.geo.alt, 0)} km. Cambia la altitud (Fase 2) o el lanzador.`, 2);
    if (!m.rideshareSizeOK) add('ride2', 'fail', 'Viaje compartido', 'Tu nave es demasiado grande para un viaje compartido.', 3);
  }
  // Estructura
  if (m.st.maxTotalMass && m.wet > m.st.maxTotalMass) add('struct', sb ? 'info' : 'fail', 'Límite de la estructura', `${m.st.name} admite como máximo ${fmtKg(m.st.maxTotalMass)} y tu nave pesa ${fmtKg(m.wet)}. Elige una estructura mayor o aligera el diseño.`, 4);
  if (m.instrMass > m.st.maxPayload) add('payload', 'fail', 'Capacidad de carga útil', `Los instrumentos pesan ${fmtKg(m.instrMass)} y ${m.st.name} solo soporta ${fmtKg(m.st.maxPayload)}.`, 4);
  // Energía
  const reqGen = m.cons * (1 + em);
  if (m.genAvg < m.cons) add('power', 'fail', 'Balance de energía', `Tu consumo (${fmtW(m.cons)}) supera la generación media (${fmtW(m.genAvg)}) en ${fmtW(m.cons - m.genAvg)}. Prueba un panel más grande o quita un instrumento.`, 4);
  else if (m.genAvg < reqGen) add('power', 'fail', 'Margen de energía', `El nivel exige ${pct(em)} de margen: necesitas generar ${fmtW(reqGen)} y generas ${fmtW(m.genAvg)}.`, 4);
  else if (m.powerMargin < 0.05) add('power', 'warn', 'Balance de energía', `Margen de solo ${pct(m.powerMargin, 1)}. Con la degradación de los paneles pronto no alcanzará.`, 4);
  else add('power', 'ok', 'Balance de energía', `Generas ${fmtW(m.genAvg)} y consumes ${fmtW(m.cons)} (margen ${pct(m.powerMargin)}).`, 4);
  // Batería
  if (!m.batOK) add('battery', 'fail', 'Batería y eclipse', `Durante el eclipse (${fmt(m.eclHcalc * 60, 0)} min) necesitas ${fmt(m.batReq, 0)} Wh usables (con DoD ${pct(m.dod)}), y tu batería tiene ${fmt(m.bat.wh, 0)} Wh. Elige una batería mayor o reduce el consumo.`, 4);
  else add('battery', 'ok', 'Batería y eclipse', `La batería (${fmt(m.bat.wh, 0)} Wh) cubre el eclipse (necesitas ${fmt(m.batReq, 0)} Wh).`, 4);
  // Presupuesto
  if (sb) add('budget', 'info', 'Presupuesto', `Sandbox: sin límite. Costo total ${fmtM(m.totalCost)} (presupuesto de referencia ${fmtM(m.budget)}).`, 1);
  else if (m.totalCost > m.budget) add('budget', 'fail', 'Presupuesto', `Costo total ${fmtM(m.totalCost)} y presupuesto ${fmtM(m.budget)}: te pasas por ${fmtM(m.totalCost - m.budget)}. ${biggestCostHint(m)}`, 4);
  else if (m.budgetUse > 0.95) add('budget', 'warn', 'Presupuesto', `Cabe, pero dejas solo ${fmtM(m.budget - m.totalCost)} de reserva: un retraso o un recorte podrían acortar la misión.`, 4);
  else add('budget', 'ok', 'Presupuesto', `${fmtM(m.totalCost)} de ${fmtM(m.budget)} (reserva ${fmtM(m.budget - m.totalCost)}).`, 4);
  // Enlace de datos
  if (!m.linkRangeOK) add('link', 'fail', 'Enlace de comunicaciones', `${m.comm.name} no tiene alcance suficiente para ${m.orbit.name}. Necesitas un transmisor de mayor alcance (Fase 5).`, 5);
  else if (!m.groundRangeOK) add('link', 'fail', 'Segmento terrestre', `${m.gnd.name} no puede escuchar una nave tan lejana. Usa una red compartida o la red de espacio profundo (Fase 5).`, 5);
  else if (m.instr.length && m.downGB < m.obj.minDataGB) add('link', 'fail', 'Enlace de datos', `Solo puedes descargar ${fmtGB(m.downGB)} y el objetivo exige al menos ${fmtGB(m.obj.minDataGB)}. Mejora el transmisor o añade estaciones.`, 5);
  else if (m.dataFrac < 1) add('link', 'warn', 'Enlace de datos', `Generas ${fmtGB(m.genGB)} pero solo descargas ${fmtGB(m.downGB)}: perderás ${pct(1 - m.dataFrac)} de los datos (y del valor científico).`, 5);
  else add('link', 'ok', 'Enlace de datos', `Descargas ${fmtGB(m.downGB)}, más de lo que generas (${fmtGB(m.genGB)}).`, 5);
  // Propulsión
  if (m.prop.id === 'none' && m.dvSC > 0) add('prop', 'fail', 'Propulsión', `Para llegar a ${m.orbit.name} la nave debe aportar ${fmt(m.dvSC, 2)} km/s de Δv (inserción orbital), pero no lleva motor.`, 4);
  else if (m.prop.id !== 'none' && !m.propOK) add('prop', 'fail', 'Combustible', `Necesitas ${fmtKg(m.propMass)} de combustible y el tanque de ${m.prop.name} solo admite ${fmtKg(m.prop.maxProp)}. Usa un motor de mayor Isp o con más capacidad.`, 4);
  else if (m.prop.id !== 'none') add('prop', 'ok', 'Propulsión', `Δv total ${fmt(m.dvTotal, 2)} km/s → ${fmtKg(m.propMass)} de combustible (incluye 10 % de reserva).`, 4);
  if (m.prop.lowThrust && m.dvSC > 0.3) add('lowthrust', 'warn', 'Empuje bajo', `La propulsión iónica tardará unos ${fmt(m.dvSC * 8, 0)} meses extra en espiralar hasta la órbita final (más costo de operaciones).`, 4);
  // Apuntado
  const badPt = m.instrValues.filter(v => v.pf < 1);
  if (badPt.length) add('point', 'warn', 'Precisión de apuntado', `Tu control de actitud logra ~${fmt(m.pointing, 3)}°, pero ${badPt.map(v => v.i.name + ' necesita ' + fmt(v.i.point, 3) + '°').join('; ')}. Sus datos saldrán “movidos” (menos ciencia). Añade ruedas de reacción y/o sensores estelares.`, 4);
  else if (m.instr.length) add('point', 'ok', 'Precisión de apuntado', `Apuntado de ~${fmt(m.pointing, 3)}°: suficiente para todos los instrumentos.`, 4);
  if (!m.momentumOK) add('momentum', 'warn', 'Descarga de las ruedas', 'Las ruedas de reacción acumulan giro y se saturan. Sin magnetopares (cerca de la Tierra) ni propulsores no podrás “descargarlas”.', 4);
  if (m.mtqUseless) add('mtq', 'warn', 'Magnetopares inútiles', `En ${m.orbit.name} no hay un campo magnético útil: los magnetopares no sirven allí. Es masa desperdiciada.`, 4);
  // Térmico
  if (!m.cryoOK) add('cryo', 'fail', 'Refrigeración criogénica', 'Llevas un instrumento infrarrojo que necesita estar muy frío: elige el sistema térmico criogénico.', 4);
  if (!m.coldOK) add('cold', 'warn', 'Frío extremo', `En ${m.orbit.name} hay eclipses fríos y poca luz: un sistema solo pasivo puede dejar la electrónica fuera de su rango. Añade calentadores.`, 4);
  if (!m.thermalOK) add('thermal', 'warn', 'Disipación de calor', `Tu nave disipa ${fmt(m.powerDensity, 1)} W/kg y ${m.th.name} solo maneja ${fmt(m.th.maxDensity, 1)} W/kg: alto riesgo de sobrecalentamiento.`, 4);
  else add('thermal', 'ok', 'Control térmico', `${fmt(m.powerDensity, 1)} W/kg dentro de la capacidad del sistema (${fmt(m.th.maxDensity, 1)} W/kg).`, 4);
  // Radiación y vida útil
  if (m.radDiff > 0) add('rad', 'warn', 'Radiación', `El entorno (nivel ${m.orbit.radiation}/5) supera la tolerancia de tu electrónica (nivel ${m.radTol}). Vida por radiación ~${fmtYears(m.radLife)}. Considera blindaje o una computadora endurecida.`, 4);
  if (m.lifeYears < m.years) add('life', 'warn', 'Vida útil', `La vida útil estimada (${fmtYears(m.lifeYears)}) es menor que la duración planificada (${fmtYears(m.years)}), limitada por ${m.lifeLimit.t}.`, 4);

/* =====================================================================
   23. PUNTUACIÓN (0–1000)

    engineer: { ok: m.massMargin >= 0.15 && m.powerMargin >= 0.10, txt: `Masa libre ${m.capacity > 0 ? pct(m.massMargin) : '—'} (≥15 %) · energía ${pct(m.powerMargin)} (≥10 %)` },
    scientist: { ok: sci >= 0.7 * m.obj.excellent, txt: `Ciencia ${fmt(sci, 0)} / ${fmt(0.7 * m.obj.excellent, 0)} pts` },

/* =====================================================================
   24. ANÁLISIS POSMISIÓN: causas, sugerencias y misión real parecida

  Object.values(LAUNCHERS).forEach(L => { if (L.id !== d.launcher && !unavailableReason(L, d, 'launcher')) add(`Lanzar con ${L.name}`, 'ajustar costo, capacidad y riesgo', x => { x.launcher = L.id; }); });

        <div class="stgrid" style="margin:0 0 12px"><div class="st"><span class="sl2">Δv necesario</span><span class="sv2">${fmt(m.dvTotal, 3)} km/s</span></div><div class="st"><span class="sl2">Combustible</span><span class="sv2">${fmtKg(m.propMass)}</span></div><div class="st"><span class="sl2">Vida por combustible</span><span class="sv2">${fmtYears(m.propLife)}</span></div></div>

    case 'protect': {
      const shCards = Object.values(SHIELDING).map(x => card({ sec: 'shielding', val: x.id, icon: iconOf('shielding', x), title: x.name, desc: x.desc, selected: d.shielding === x.id, specs: ['☢️ +' + x.radBonus, '☄️ −' + pct(x.mm), '⚖️ +' + pct(x.massFrac)], deltaKeys: ['mass', 'cost', 'life'] })).join('');
      const redDelta = deltaHTML(trialDelta('redundancy', null), ['mass', 'cost', 'rel']);
      return `<div class="secthead"><h3>🌡️ Control térmico</h3><span class="chip ${m.thermalOK ? 'ok' : 'warn'}">${fmt(m.powerDensity, 2)} W/kg</span></div>
        <div class="cards">${catalogCards('thermal', THERMAL, { hideUnavailable: true, specs: x => ['🔥 ≤ ' + fmt(x.maxDensity, 1) + ' W/kg', x.cryo ? '❄️ criogénico' : x.coldOK ? '🥶 resiste frío' : '—', '⚖️ +' + pct(x.massFrac)], deltaKeys: ['mass', 'cons', 'cost'] })}</div>
        <div class="secthead" style="margin-top:18px"><h3>🛡️ Blindaje ${qBtn('radiacion')}</h3>${ownerBadge('shielding')}</div><div class="cards">${shCards}</div>
        <div class="secthead" style="margin-top:18px"><h3>♻️ Redundancia ${qBtn('fiabilidad')}</h3>${ownerBadge('redundancy')}</div>
        <button type="button" class="switch${d.redundancy ? ' on' : ''}" data-act="pick" data-sec="redundancy" data-val="x" data-fk="redundancy:x" aria-pressed="${d.redundancy}"><span class="knob"></span> Duplicar sistemas críticos <span class="delta">${redDelta}</span></button>`;
    }
  }
  return '';
}
function resourceSummary(m) {
  const rows = [
    ['Masa seca (sin margen)', fmtKg(m.dryNoMargin)], [`Margen de contingencia (${pct(m.marginPct)})`, fmtKg(m.marginMass)], ['Combustible', fmtKg(m.propMass)],
    ['<b>Masa total al lanzamiento</b>', '<b>' + fmtKg(m.wet) + '</b>'], ['Capacidad del lanzador', m.capacity > 0 ? fmtKg(m.capacity) : '—'],
    ['Generación media / consumo', fmtW(m.genAvg) + ' / ' + fmtW(m.cons)], ['Batería disponible / necesaria', fmt(m.bat.wh, 0) + ' / ' + fmt(m.batReq, 0) + ' Wh'],
    ['Datos generados / descargables', fmt(m.genGB, autoDec(m.genGB)) + ' / ' + fmt(m.downGB, autoDec(m.downGB)) + ' GB/día'],
    ['Desarrollo (incl. 40 % integración y pruebas)', fmtM(m.devCost)], ['Lanzamiento', fmtM(m.launchCost)], ['Estaciones + operaciones', fmtM(m.groundCap + m.opsCost)],
    ['<b>Costo total / presupuesto</b>', '<b>' + fmtM(m.totalCost) + '</b> / ' + fmtM(m.budget)], ['Vida útil estimada', fmtYears(m.lifeYears)], ['Fiabilidad estimada', pct(m.reliability, 1)], ['Valor científico estimado', fmt(m.science, 0) + ' pts']
  ];
  return `<div class="tablewrap"><table><tbody>${rows.map(r => `<tr><td class="small">${r[0]}</td><td class="num small">${r[1]}</td></tr>`).join('')}</tbody></table></div>`;
}
function equipmentList(m) {
  const rows = [];
  const push = (cat, x, mass, power, cost) => rows.push([cat, x, mass, power, cost]);
  push('Estructura', m.st.name, m.st.mass, m.st.basePower, m.st.cost);
  m.instr.forEach(i => push('Instrumento', i.name, i.mass, i.power, i.cost));
  push('Paneles solares', m.sp.name, m.sp.mass, -m.genAvg, m.sp.cost);
  push('Batería', m.bat.name, m.bat.mass, 0, m.bat.cost);
  push('Computadora', m.obc.name, m.obc.mass, m.obc.power, m.obc.cost);
  m.adcs.forEach(a => push('Control de actitud', a.name, a.mass, a.power, a.cost));
  if (m.prop.id !== 'none') push('Propulsión', m.prop.name, m.prop.dryMass, m.prop.power, m.prop.cost);
  push('Comunicaciones', m.comm.name, m.comm.mass, m.comm.power * m.commDuty, m.comm.cost);
  push('Térmico', m.th.name, m.thermalMass, m.thermalPower, m.thermalCost);
  if (m.sh.id !== 'none') push('Blindaje', m.sh.name, m.shieldMass, 0, m.shieldCost);
  if (m.d.redundancy) push('Redundancia', 'Unidades de respaldo', m.redMass, 0, m.redCost);
  push('Margen', 'Contingencia de masa', m.marginMass, 0, 0);
  if (m.propMass) push('Combustible', m.prop.name, m.propMass, 0, 0);
  return `<div class="tablewrap"><table><thead><tr><th>Subsistema</th><th>Equipo</th><th class="num">Masa</th><th class="num">Potencia</th><th class="num">Costo</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td class="small">${r[0]}</td><td class="small">${r[1]}</td><td class="num">${fmtKg(r[2])}</td><td class="num">${r[3] < 0 ? '<span class="ok">+' + fmtW(-r[3]) + '</span>' : fmtW(r[3])}</td><td class="num">${fmtM(r[4])}</td></tr>`).join('')}
    <tr><td colspan="2"><b>Total</b> (hardware; + ${fmtM(m.aitCost)} de integración y pruebas)</td><td class="num"><b>${fmtKg(m.wet)}</b></td><td class="num"><b>${fmtW(m.cons)}</b></td><td class="num"><b>${fmtM(m.hardwareCost)}</b></td></tr></tbody></table></div>`;
}

/* ---------- Fase 5: Segmento terrestre ---------- */
function renderP5() {
  const d = S.design, m = M();
  const commCards = Object.values(COMMS).map(x => {
    const reason = unavailableReason(x, d);
    if (reason && x.size && (STRUCTURES[d.structure].size < x.size[0] || STRUCTURES[d.structure].size > x.size[1])) return '';
    const reach = x.maxRange >= m.orbit.rangeClass;
    const rate = reach && m.groundRangeOK ? Math.min(x.rate, x.rate * m.orbit.linkFactor * x.gain * m.gnd.gain) : 0;
    return card({ sec: 'comms', val: x.id, icon: iconOf('comms', x), title: x.name, desc: x.desc, selected: d.comms === x.id, reason,
      specs: [reach ? '📶 ' + fmt(rate, rate < 1 ? 3 : 1) + ' Mbps aquí' : '✗ no alcanza', pW(x.power), pM(x.cost)], deltaKeys: ['down', 'mass', 'cost'] });
  }).join('');
  const gndCards = Object.values(GROUND).map(x => {
    const reach = x.maxRange >= m.orbit.rangeClass;
    const cm = contactMinutes(m.orbit, m.geo, x);
    return card({ sec: 'ground', val: x.id, icon: iconOf('ground', x), title: x.name, desc: x.desc, selected: d.ground === x.id,
      specs: [reach ? '⏱️ ' + fmt(cm, 0) + ' min/día' : '✗ no alcanza', '💰 ' + (x.cost ? fmtM(x.cost * m.sc.groundScale) : '0') + ' + ' + fmtM(x.opsYear * m.sc.groundScale) + '/año'], deltaKeys: ['down', 'cost', 'rel'] });
  }).join('');
  const ratio = m.genGB > 0 ? m.downGB / m.genGB : (m.downGB > 0 ? 2 : 0);
  const loss = m.genGB > 0 ? Math.max(0, 1 - ratio) : 0;
  const dur = m.downGB > 0 ? clamp(2.6 / Math.log10(10 + m.downGB * 20), 0.25, 2.6) : 0;
  const state = !m.linkOK ? 'cut' : loss > 0 ? 'leak' : 'good';
  return `
  <div class="panel"><h3>📊 Flujo de datos ${qBtn('tasadatos')}</h3>
    <div class="flow ${state}"><div class="fnode"><span class="fi">🛰️</span><b>${fmt(m.genGB, autoDec(m.genGB))}</b><small>GB/día generados</small></div>
      <div class="pipe"><span style="animation-duration:${dur || 1}s"></span>${loss > 0 ? '<i class="drip"></i><i class="drip d2"></i><i class="drip d3"></i>' : ''}</div>
      <div class="fnode"><span class="fi" style="animation-delay:.6s">📡</span><b>${fmt(m.downGB, autoDec(m.downGB))}</b><small>GB/día descargables</small></div></div>
    <div class="flowstats"><div class="st"><span class="sl2">📶 Velocidad</span><span class="sv2">${fmt(m.rateMbps, m.rateMbps < 1 ? 4 : 1)} Mbps</span></div>
      <div class="st"><span class="sl2">⏱️ Contacto ${qBtn('contacto')}</span><span class="sv2">${fmt(m.contactMin, 0)} min/día</span></div>
      <div class="st"><span class="sl2">${loss > 0 ? '💧 Datos perdidos' : '⏳ Retardo'}</span><span class="sv2 ${loss > 0 ? 'bad' : ''}">${loss > 0 ? pct(loss) : fmtDelay(m.orbit.delayS)}</span></div></div>
    <div class="note ${state === 'cut' ? 'bad' : state === 'leak' ? 'warn' : 'ok'}" style="margin-top:12px">${state === 'cut' ? (m.linkRangeOK ? '✂️ Tus estaciones no oyen a la nave a esta distancia.' : '✂️ Tu transmisor no llega tan lejos.') : state === 'leak' ? '💧 ¡Se derraman datos! Más estaciones o un transmisor más rápido.' : '✅ Todo llega a la Tierra.'}</div></div>
  <div class="grid2">
    <div class="panel"><div class="secthead"><h3>📶 Transmisor</h3>${ownerBadge('comms')}</div><div class="cards">${commCards}</div>
      ${hint('La señal se debilita con la distancia al cuadrado: lejos de la Tierra hacen falta antenas grandes en la nave y en tierra.')}</div>
    <div class="panel"><div class="secthead"><h3>🏠 Estaciones</h3>${ownerBadge('ground')}</div><div class="cards">${gndCards}</div>
      <div class="vizwrap" style="margin-top:12px"><canvas id="orbit-canvas" class="viz" role="img" aria-label="Animación de los pases sobre las estaciones terrestres"></canvas></div></div>
  </div>`;
}

/* ---------- Fase 6: Verificación GO / NO GO ---------- */
function renderP6() {
  const m = M(), ch = runChecks(m, teamOpts()), sm = checkSummary(ch);
  const order = { fail: 0, warn: 1, info: 2, ok: 3 };
  const label = { ok: 'GO', warn: 'ALERTA', fail: 'NO GO', info: 'INFO' };
  const list = ch.slice().sort((a, b) => order[a.status] - order[b.status]).map((c, i) => `<div class="go ${c.status}" style="animation-delay:${i * 70}ms" title="${esc(plain(c.detail))}"><div class="goh"><span class="gos">${label[c.status]}</span><b>${c.title}</b></div>
    ${c.status === 'fail' || c.status === 'warn' ? `<p>${c.detail}</p><button class="btn sm" data-act="goto" data-val="${c.phase}">🔧 Corregir en fase ${c.phase}</button>` : ''}</div>`).join('');
  const go = !sm.fails.length;
  const approval = S.mode === 'team' ? `<div class="panel"><h3>🎖️ Aprobación del Director/a</h3>
    ${S.directorApproved ? '<div class="note ok">✅ Aprobado. Cualquier cambio anula la aprobación.</div>' : `<button class="btn primary" data-act="approve-final" ${isDirector() ? '' : 'aria-disabled="true"'}>✅ Aprobar para el lanzamiento</button>${isDirector() ? '' : '<p class="small warn">Pasa el turno al Director/a.</p>'}`}</div>` : '';
  const exp = expectedScore(S.design, scoreExtra()).s.total;
  return `
  <div class="verdict ${go ? 'go' : 'nogo'}"><span class="vlight" aria-hidden="true"></span><div class="grow"><div class="vt1">${go ? 'GO PARA LANZAMIENTO' : 'NO GO'}</div>
    <div class="vt2">✅ ${ch.filter(c => c.status === 'ok').length} · ⚠️ ${sm.warns.length} · ❌ ${sm.fails.length} · 🏆 ~${exp} pts esperados</div></div>
    ${go ? '<button class="btn primary" data-act="goto" data-val="7">🚀 ¡Al lanzamiento!</button>' : ''}</div>
  ${approval}
  <div class="gogrid">${list}</div>`;
}

/* ---------- Fase 7: Lanzamiento y simulación ---------- */

    return `<div class="panel launchpad"><div class="padrocket" aria-hidden="true">🚀</div><div>

      <h3 style="font-size:1.4rem">Listo en la plataforma</h3>

      <div class="btnrow" style="margin-top:14px"><label for="seed" class="small muted">🎲 Semilla</label><input id="seed" type="number" min="1" max="999999" value="${S.seed}" data-bind="seed" style="background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:12px;padding:7px 10px;max-width:130px"><button class="btn sm" data-act="newseed">🎲 Otra</button></div>
      <p class="tiny muted">Misma semilla + mismo diseño = misma simulación.</p>
      <button class="btn primary big glow" data-act="launch" style="margin-top:8px">🔥 ¡LANZAR!</button></div></div>`;

      <div class="btnrow no-print" id="sim-ctrl">${[1, 2, 4, 8].map(x => `<button class="btn sm${S.sim.speed === x ? ' primary' : ''}" data-act="speed" data-val="${x}" aria-label="Velocidad ${x}x">${x}×</button>`).join('')}<button class="btn sm" data-act="pause" id="btn-pause">${S.sim.playing ? '⏸' : '▶'}</button><button class="btn sm" data-act="skip">⏭ Final</button></div></div>
    <div class="vizwrap" id="sim-viz"><canvas id="${S.sim.stage === 'launch' ? 'launch-canvas' : 'orbit-canvas'}" class="viz tall" role="img" aria-label="Animación de la misión"></canvas><div id="evpop-holder"></div></div>
    <div class="timeline" id="timeline" aria-label="Línea de tiempo de la misión"></div>
    <div class="simstats" id="simstats"></div></div>
  <div class="grid2"><div class="panel"><h3>⚡ Energía</h3><canvas id="chart-power" class="viz chart" role="img" aria-label="Gráfico de generación y consumo de energía por mes"></canvas><div class="legend"><span><i style="background:#ffd27a"></i>generación</span><span><i style="background:#84e3d5"></i>consumo</span></div></div>
    <div class="panel"><h3>📥 Datos</h3><canvas id="chart-data" class="viz chart" role="img" aria-label="Gráfico de datos generados y descargados acumulados"></canvas><div class="legend"><span><i style="background:#b8a6ff"></i>generados</span><span><i style="background:#7ddf8a"></i>descargados</span></div></div></div>
  <div class="panel"><h3>📜 Bitácora</h3><div class="evlog" id="evlog" aria-live="polite"></div></div>
  ${S.sim.stage === 'done' ? `<div class="btnrow" style="margin:6px 0 10px"><button class="btn primary" data-act="goto" data-val="8">🏆 Ver informe</button><button class="btn" data-act="resim">🎲 Otra vez</button><button class="btn" data-act="goto" data-val="4">🔧 Rediseñar</button></div>` : ''}`;
}

/* ---------- Fase 8: Informe ---------- */

  const res = S.lastResult;
  if (!res) return '<div class="panel">Todavía no hay resultados.</div>';
  const { m, R, s } = res;
  const stale = res.version !== S.designVersion;
  const cats = [['🎯 Éxito de la misión', s.success, 300], ['⭐ Valor científico', s.science, 250], ['⚙️ Eficiencia', s.efficiency, 200], ['⚖️ Equilibrio (CML)', s.balance, 150], ['🤝 ' + s.collabLabel, s.collab, 100]];
  const resRows = [
    ['⚖️ Masa', fmtKg(m.wet), m.capacity > 0 ? fmtKg(m.capacity) : '—', m.capacity > 0 ? pct(m.massUse) : '—'],
    ['⚡ Energía', fmtW(m.cons), fmtW(m.genAvg), pct(m.cons / m.genAvg)],
    ['💰 Presupuesto', fmtM(R.finalCost), fmtM(m.budget), pct(R.finalCost / m.budget)],

    <div><div class="rl">${s.rating.icon} ${s.rating.name}</div><div class="small muted">${m.sc.icon} ${esc(m.sc.name)} · ${esc(m.obj.name)} · ${DIFFICULTIES[m.d.difficulty].name}${m.sandbox ? ' · sandbox' : ''} · 🎲 ${R.seed}</div>
      <div style="margin-top:8px">${res.badges.length ? res.badges.map((b, i) => `<span class="badge" style="animation-delay:${0.6 + i * 0.15}s">${b[0]} ${b[1]}</span>`).join('') : '<span class="small muted">Sin insignias esta vez.</span>'}</div></div></div>

    <div class="panel"><h3>🏅 Puntuación</h3>${cats.map((c, i) => `<div class="sbar"><span>${c[0]}</span><div class="bar"><div class="fill" style="width:${c[1] / c[2] * 100}%;animation-delay:${0.2 + i * 0.12}s"></div></div><span class="mono small" style="text-align:right">${Math.round(c[1])}/${c[2]}</span></div>`).join('')}
      <p class="tiny muted">&lt;400 fallida · 400–599 parcial · 600–799 exitosa · ≥800 excepcional</p></div>

  </div>
  <div class="panel"><h3>🛰️ Resultado</h3>
    <div class="note ${R.launchOK && R.completed ? 'ok' : R.launchOK ? 'warn' : 'bad'}">${!R.launchOK ? '💥 ' + esc(R.endCause) + '.' : R.completed ? `✅ La nave completó la duración planificada (${fmtYears(m.years)}).` : `⚠️ Terminó en el mes ${R.opMonths} de ${R.plannedMonths}: ${esc(R.endCause || 'fin anticipado')}.`}${R.delayMonths ? ` ⏳ Retraso de ${R.delayMonths} meses.` : ''}</div>
    <div class="tablewrap"><table><thead><tr><th>Recurso</th><th class="num">Usado</th><th class="num">Disponible</th><th class="num">%</th></tr></thead><tbody>${resRows.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="grid2">
    <div class="panel"><h3>🔍 ¿Por qué?</h3>
      ${res.causes.neg.length ? `<ol class="causes small">${res.causes.neg.map(c => `<li>${c.text} <span class="imp n">−${c.impact}</span></li>`).join('')}</ol>` : '<p class="ok">¡Nada importante restó puntos!</p>'}
      ${res.causes.pos.length ? `<h4>👍 Lo que funcionó</h4><ul class="causes small">${res.causes.pos.map(c => `<li>${c.text}</li>`).join('')}</ul>` : ''}</div>
    <div class="panel"><h3>🛠️ Qué podrías cambiar</h3>
      ${res.sugg.list.length ? `<ol class="causes">${res.sugg.list.map((g, i) => `<li><b>${esc(g.label)}</b><br><span class="small muted"><span class="ok">+${g.dScore} pts</span> · ${sgn(g.dCost, fmtM)} · ${sgn(g.dMass, fmtKg)}${Math.abs(g.dSci) > 0.5 ? ' · ' + sgn(g.dSci, x => fmt(x, 0) + ' ⭐') : ''}${Math.abs(g.dRel) > 0.001 ? ' · ' + sgn(g.dRel, x => fmt(x * 100, 1) + ' % fiab.') : ''}</span><br><button class="btn sm" data-act="apply-sugg" data-val="${i}" style="margin-top:5px">✨ Aplicar y rediseñar</button></li>`).join('')}</ol>` : '<p>¡Tu diseño está cerca del óptimo! Prueba otro objetivo u órbita.</p>'}
      <p class="tiny muted">Efectos estimados sin eventos aleatorios.</p></div>
  </div>
  <details class="panel fold"><summary>📜 Eventos ocurridos (${R.events.length})</summary>${R.events.length ? R.events.map(e => eventHTML(e)).join('') : '<p class="muted">Ningún imprevisto. ¡Suerte… o buen diseño!</p>'}</details>

  <details class="panel fold"><summary>🔗 Conexión con la realidad: los 4 segmentos</summary><div class="grid2">
    <div class="seg"><h4>🚀 Lanzamiento</h4><p class="small">${m.L ? `${esc(m.L.name)} (${esc(m.L.ref)}) llevó ${fmtKg(m.wet)} a ${LAUNCH_CLASS_NAMES[m.orbit.launcherClass]} por ${fmtM(m.launchCost)}.` : ''} ${R.launchOK ? 'Éxito.' : 'Falló.'}</p></div>

/* ---------- Secuencia animada de lanzamiento ---------- */

    if (failed && !parts.boom) { parts.boom = true; for (let i = 0; i < 140; i++) { const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 160; parts.push({ x: rx, y: baseY - H1, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1.6, c: 'fire' }); } }

/* ---------- Radar de dimensiones (SVG) ---------- */
function radarSVG(dims) {
  const keys = Object.keys(dims), n = keys.length, cx = 160, cy = 130, R = 90;
  const pt = (i, r) => [cx + r * Math.sin(2 * Math.PI * i / n), cy - r * Math.cos(2 * Math.PI * i / n)];
  let s = '';
  [0.25, 0.5, 0.75, 1].forEach(k => { s += `<polygon points="${keys.map((_, i) => pt(i, R * k).join(',')).join(' ')}" fill="none" stroke="#25345a"/>`; });
  keys.forEach((k, i) => { const [x, y] = pt(i, R); s += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#25345a"/>`; const [lx, ly] = pt(i, R + 18); s += `<text x="${lx}" y="${ly + 4}" text-anchor="middle" font-size="11" fill="#cfe0ff" font-family="system-ui,sans-serif">${k} ${Math.round(dims[k] * 100)}%</text>`; });
  s += `<polygon points="${keys.map((k, i) => pt(i, R * clamp(dims[k])).join(',')).join(' ')}" fill="rgba(132,227,213,0.25)" stroke="#84e3d5" stroke-width="2"/>`;
  return `<svg viewBox="0 0 320 260" style="width:100%;max-height:280px" role="img" aria-label="Radar del equilibrio entre dimensiones: ${keys.map(k => k + ' ' + Math.round(dims[k] * 100) + '%').join(', ')}">${s}</svg>`;
}

function launchMission() {
  const m = M(); const ch = runChecks(m, teamOpts());
  if (ch.some(c => c.status === 'fail')) { toast('El diseño no pasa la verificación: revisa la Fase 6.', 'bad'); gotoPhase(6); return; }
  const R = simulate(S.design, S.seed);
  S.sim = { R, m, version: S.designVersion, stage: 'launch', speed: 1, playing: true, month: 0, shown: 0, extra: scoreExtra(), design: deepClone(S.design), _lastM: -1 };
  S.runCount++;
  renderPhase();
}
function simTotalMonths(sim) { return (sim.R.cruiseMonths || 0) + Math.max(1, sim.R.opMonths); }
function mountSim() {
  const sim = S.sim;
  if (!sim || !$('#simstats')) return;
  buildTimeline();
  if (sim.stage === 'launch') {
    const c = $('#launch-canvas');
    runLaunch(c, { fail: !sim.R.launchOK, failSeed: sim.R.seed, name: sim.m.L.name, delay: sim.R.delayMonths, panels: sim.m.sp.id !== 'sp_cube_body' }, () => {
      if (!sim.R.launchOK) { finishPlayback(); }
      else { sim.stage = 'ops'; renderPhase(); }
    });
    updateSimDOM(true);
  } else if (sim.stage === 'ops') { updateSimDOM(true); startPlaybackLoop(); }
  else updateSimDOM(true);
}
function startPlaybackLoop() {
  const sim = S.sim; if (!sim || sim.stage !== 'ops') return;
  const total = simTotalMonths(sim), dur = 10 + total * 0.12;
  let last = performance.now();
  if (VZ.simRaf) cancelAnimationFrame(VZ.simRaf);
  const loop = now => {
    if (!$('#simstats') || S.sim !== sim) { VZ.simRaf = null; return; }
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (sim.playing) sim.month += dt * sim.speed * total / dur;
    if (sim.month >= total) { sim.month = total; updateSimDOM(); finishPlayback(); return; }
    updateSimDOM();
    VZ.simRaf = requestAnimationFrame(loop);
  };
  VZ.simRaf = requestAnimationFrame(loop);
}
function buildTimeline() {
  const sim = S.sim, el = $('#timeline'); if (!el) return;
  const R = sim.R, total = simTotalMonths(sim), cruise = R.cruiseMonths || 0;
  const pos = mo => 12 + (el.clientWidth - 24) * clamp(mo / total) ;
  const marks = [[0, '🚀', 'Lanzamiento'], [Math.max(0.3, cruise), '🛰️', cruise ? 'Llegada y despliegue' : 'Despliegue']];
  if (R.launchOK) { marks.push([cruise + Math.min(1, R.opMonths), '🔬', 'Inicio de operaciones']); R.events.filter(e => e.month > 0).forEach(e => marks.push([cruise + e.month, e.icon, e.name + ' (mes ' + e.month + ')'])); marks.push([total, '🏁', R.completed ? 'Fin de misión' : 'Fin anticipado']); }
  else marks.push([0.5, '💥', 'Falla del lanzador']);
  el.innerHTML = `<div class="tl-axis"></div><div class="tl-prog" id="tl-prog" style="width:0"></div>` + marks.map(mk => `<div class="tl-m" style="left:${pos(mk[0])}px" title="${esc(mk[2])}" aria-label="${esc(mk[2])}">${mk[1]}<span>${mk[0] === 0 ? 'T0' : 'm' + Math.round(mk[0])}</span></div>`).join('');
}
function updateSimDOM(force) {
  const sim = S.sim; if (!sim) return;
  const cm = Math.floor(sim.month);
  if (cm === sim._lastM && !force) return;
  sim._lastM = cm;
  const R = sim.R, m = sim.m, cruise = R.cruiseMonths || 0, total = simTotalMonths(sim);
  const om = clamp(cm - cruise, 0, R.opMonths);
  const done = sim.stage === 'done';
  const shownMonths = done ? R.opMonths : om;
  const row = R.months[Math.max(0, shownMonths - 1)];
  const prog = $('#tl-prog'); const tl = $('#timeline');
  if (prog && tl) prog.style.width = ((tl.clientWidth - 24) * clamp((done ? total : sim.month) / total)) + 'px';
  const stats = $('#simstats');
  if (stats) {
    const stCell = (v, l) => `<div class="stat"><div class="sv">${v}</div><div class="sl">${l}</div></div>`;
    stats.innerHTML = [
      stCell(R.launchOK ? (cm < cruise && !done ? 'crucero' : `${shownMonths}/${R.plannedMonths}`) : '—', 'mes de operación'),
      stCell(row ? fmt(row.cumDown, row.cumDown < 10 ? 2 : 0) + ' GB' : '0 GB', 'datos descargados'),
      stCell(row ? fmt(row.sci, 0) + ' pts' : '0 pts', 'valor científico acumulado'),
      stCell(row ? pct(row.duty) : '—', 'instrumentos activos (energía)')
    ].join('');
  }
  // eventos
  const log = $('#evlog');
  if (log) {
    const visible = R.events.filter(e => done || e.month <= om || (e.month === 0));
    if (force) { log.innerHTML = ''; sim.shown = 0; }
    if (!R.launchOK && (done || force) && !log.querySelector('.launchfail')) log.insertAdjacentHTML('afterbegin', `<div class="ev sev launchfail"><b>💥 Falla del lanzador</b><div class="small">${esc(R.endCause)}.</div><div class="lesson">🎓 <b>Lección:</b> ningún cohete es 100 % fiable. La probabilidad de éxito de ${esc(m.L.name)} era ${pct(m.relLaunch, 1)}. Las agencias eligen lanzadores con mucho historial para cargas valiosas y a veces aseguran la misión.</div></div>`);
    for (let i = sim.shown; i < visible.length; i++) {
      const e = visible[i];
      log.insertAdjacentHTML('afterbegin', eventHTML(e));
      if (!force && !done) { SFX.alert(); const hold = $('#evpop-holder'); if (hold) { hold.innerHTML = `<div class="evpop">${e.icon} <b>${esc(e.name)}</b> · ${e.mitigated ? '✅ mitigado' : esc(e.effect)}</div>`; } }
    }
    sim.shown = visible.length;
    if (!log.children.length) log.innerHTML = '<p class="muted small" id="noev">Sin eventos por ahora…</p>';
    else { const ne = $('#noev'); if (ne && log.children.length > 1) ne.remove(); }
    if (done && R.launchOK && !log.querySelector('.endmsg')) log.insertAdjacentHTML('afterbegin', `<div class="ev info endmsg"><b>🏁 ${R.completed ? 'Misión completada' : 'Fin anticipado de la misión'}</b><div class="small">${R.completed ? `La nave completó la duración planificada (${fmtYears(m.years)}).` : esc(R.endCause || '')}</div></div>`);
  }
  // gráficos
  const months = R.months.slice(0, shownMonths);
  drawChart($('#chart-power'), { xMax: R.plannedMonths, yLabel: 'W', series: [{ data: months.map(x => x.gen), color: '#ffd27a' }, { data: months.map(x => x.need), color: '#84e3d5', dash: true }] });
  drawChart($('#chart-data'), { xMax: R.plannedMonths, yLabel: 'GB', series: [{ data: months.map(x => x.cumGen), color: '#b8a6ff', dash: true }, { data: months.map(x => x.cumDown), color: '#7ddf8a' }] });
  const title = $('#sim-title'); if (title && done) title.textContent = '🏁 Misión terminada';
}
function finishPlayback(silent) {
  const sim = S.sim; if (!sim || sim.stage === 'done') return;
  if (VZ.simRaf) { cancelAnimationFrame(VZ.simRaf); VZ.simRaf = null; }
  if (VZ.launchRaf) { cancelAnimationFrame(VZ.launchRaf); VZ.launchRaf = null; }
  sim.stage = 'done'; sim.month = simTotalMonths(sim); sim.playing = false;
  const m = sim.m, R = sim.R, s = scoreResult(R, m, sim.extra);
  const base = expectedScore(sim.design, sim.extra);
  const entryId = 'e' + Date.now() + '-' + S.runCount;
  const badges = computeBadges(m, R, s, { board: S.leaderboard, mode: S.mode, firstTry: S.decision.firstTry === true });
  S.lastResult = { m, R, s, base, badges, causes: buildCauses(m, R, s, base), sugg: buildSuggestions(sim.design, sim.extra), real: matchRealMission(m), version: sim.version, design: sim.design, entryId };
  S.leaderboard.push({ id: entryId, name: 'Diseño ' + (S.leaderboard.length + 1), summary: `${m.orbit.short} · ${m.L.name} · ${m.instr.length} instr.`, scenarioId: m.sc.id, scenarioName: m.sc.name,
    diffName: DIFFICULTIES[m.d.difficulty].name, sandbox: m.sandbox, score: s.total, ratingId: s.rating.id, ratingName: s.rating.icon + ' ' + s.rating.name, cost: R.finalCost, mass: m.wet, science: R.science, design: deepClone(sim.design) });
  if (!silent) {
    toast(`${s.rating.icon} Misión terminada: ${s.rating.name} (${s.total} puntos). Revisa el informe.`, s.rating.id === 'fail' ? 'bad' : 'ok');
    renderPhasebar(); renderPhase();
  }
}

  const L = [];
  L.push('ASIMETITOS — INFORME DE MISIÓN', '==============================');
  L.push(`Escenario: ${m.sc.name} · Objetivo: ${m.obj.name}`, `Dificultad: ${DIFFICULTIES[m.d.difficulty].name} · Modo: ${MODES[m.d.mode].name} · Semilla: ${R.seed}`, '');

  L.push(`  Órbita: ${m.orbit.name}${m.orbit.alt && m.orbit.alt.min != null ? ' a ' + m.d.altitude + ' km' : ''}`, `  Lanzador: ${m.L.name} (${m.L.ref})`, `  Estructura: ${m.st.name}`, `  Instrumentos: ${m.instr.map(i => i.name).join(', ')}`);
  L.push(`  Energía: ${m.sp.name} + ${m.bat.name}`, `  Computadora: ${m.obc.name} · Control: ${m.adcs.map(a => a.name).join(', ') || 'pasivo'}`, `  Propulsión: ${m.prop.name} · Térmico: ${m.th.name} · Blindaje: ${m.sh.name} · Redundancia: ${m.d.redundancy ? 'sí' : 'no'}`);
  L.push(`  Comunicaciones: ${m.comm.name} · Segmento terrestre: ${m.gnd.name}`, `  Duración planificada: ${fmtYears(m.years)}`);
  L.push('', 'RECURSOS USADOS VS. DISPONIBLES');
  L.push(`  Masa: ${fmtKg(m.wet)} de ${fmtKg(m.capacity)} (${pct(m.massUse)})`, `  Energía: consumo ${fmtW(m.cons)} / generación ${fmtW(m.genAvg)}`, `  Presupuesto: ${fmtM(R.finalCost)} de ${fmtM(m.budget)}`, `  Datos: ${fmt(R.downGB, 1)} GB descargados de ${fmt(R.genGB, 1)} GB generados (${pct(R.dataFracActual)})`, `  Operación: ${fmtYears(R.opYears)} de ${fmtYears(m.years)} · Ciencia: ${fmt(R.science, 0)} pts (excelente ${m.obj.excellent})`);
  L.push('', 'RESULTADO DE LA SIMULACIÓN', '  ' + (!R.launchOK ? R.endCause : R.completed ? 'Misión completada.' : 'Fin anticipado: ' + (R.endCause || '')));
  L.push('', 'EVENTOS'); if (!R.events.length) L.push('  Ninguno.'); R.events.forEach(e => L.push(`  - ${e.name} (${e.month ? 'mes ' + e.month : 'prelanzamiento'})${e.mitigated ? ' [mitigado]' : ''}: ${e.effect}`, `    Lección: ${e.lesson}`));
  const strip = x => String(x).replace(/<[^>]+>/g, '');
  L.push('', 'POR QUÉ TUVO ÉXITO O FALLÓ (por impacto)'); res.causes.neg.forEach((c, i) => L.push(`  ${i + 1}. ${strip(c.text)} (≈ −${c.impact} pts)`)); res.causes.pos.forEach(c => L.push(`  + ${strip(c.text)}`));
  L.push('', 'QUÉ PODRÍAS CAMBIAR'); if (!res.sugg.list.length) L.push('  Tu diseño está cerca del óptimo.'); res.sugg.list.forEach((g, i) => L.push(`  ${i + 1}. ${g.label} → +${g.dScore} pts, ${sgn(g.dCost, fmtM)}, ${sgn(g.dMass, fmtKg)}`));
  if (res.real) L.push('', 'MISIÓN REAL PARECIDA', `  ${res.real.r.name}: ${res.real.r.text}`, `  Se parece en: ${res.real.same.join('; ') || 'el tipo de escenario'}.`);
  L.push('', 'Referencias: NASA Mission Design and Development · JPL Concept Maturity Levels · NASA Mission Design Lab · GMAT · NASA Mission Viz · “Build It Yourself: Satellite!” · CubeSat 101.');

}

// Construye un diseño completo del motor a partir de las 4 elecciones (índices 0–2)
function buildSimpleDesign(scenarioId, difficulty, pick) {
  const sc = SCENARIOS[scenarioId], kit = SIMPLE_KITS[scenarioId];
  const d = Object.assign(deepClone(sc.suggested), { scenarioId, objectiveId: sc.suggestedObjective || sc.objectives[0].id, difficulty, mode: 'solo' });
  const e = kit.eye[pick.eye], p = kit.power[pick.power], a = kit.antenna[pick.antenna], r = kit.rocket[pick.rocket];
  d.budgetBoost = kit.budgetBoost || 1;
  d.instruments = e.i.slice(); d.solar = p.solar; d.battery = p.battery; d.comms = a.comms; d.ground = a.ground; d.launcher = r.launcher;
  // estructura: la más pequeña en la que caben las piezas elegidas
  const fits = sid => {
    const st = STRUCTURES[sid], t = Object.assign({}, d, { structure: sid });
    if (d.instruments.length > st.maxInstr) return false;
    if (d.instruments.reduce((s, id) => s + INSTRUMENTS[id].mass, 0) > st.maxPayload) return false;
    return [...d.instruments.map(id => INSTRUMENTS[id]), SOLAR[d.solar], BATTERIES[d.battery], COMMS[d.comms]].every(x => !unavailableReason(x, t));
  };
  d.structure = sc.structures.find(fits) || sc.structures[sc.structures.length - 1];
  sanitizeDesign(d);
  d.launcher = r.launcher;   // se mantiene aunque no sea adecuado: el juego lo explica
  autoTune(d);

// Ajustes automáticos de subsistemas que el jugador no ve (térmico, propulsión)
function autoTune(d) {
  for (let k = 0; k < 3; k++) {
    const m = computeMetrics(d);
    if (!m.thermalOK && d.thermal !== 'th_active' && THERMAL.th_active && !unavailableReason(THERMAL.th_active, d)) { d.thermal = d.thermal === 'th_passive' ? 'th_heaters' : 'th_active'; continue; }
    break;
  }
}

function burst(x, y, colors = ['#84e3d5', '#b8a6ff', '#ffb59e', '#7ddf8a', '#f2c878'], n = 18) {
  if (reduceMotion() || !document.body.animate) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); const col = colors[i % colors.length];
    s.className = 'spark'; s.style.left = (x - 3.5) + 'px'; s.style.top = (y - 3.5) + 'px'; s.style.background = col; s.style.boxShadow = `0 0 10px ${col}`;
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, dist = 30 + Math.random() * 70;
    const anim = s.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist}px) scale(.2)`, opacity: 0 }], { duration: 600 + Math.random() * 400, easing: 'cubic-bezier(.2,.8,.2,1)' });
    anim.onfinish = () => s.remove();
  }
}

/* ---------- Números flotantes sobre los anillos (+8 kg, −2 M$…) ---------- */
const FLOAT_MAP = { mass: 'mass', cons: 'power', gen: 'power', cost: 'budget', down: 'data', sci: 'sci', life: 'life', rel: 'rel' };
function spawnFloaties(dm) {
  if (!dm || reduceMotion() || !document.body.animate) return;
  let k = 0;
  Object.entries(FLOAT_MAP).forEach(([key, ring]) => {
    const v = dm[key], def = DKEYS[key];
    if (!isFinite(v) || Math.abs(v) < def.thr) return;
    const el = document.querySelector(`#dashboard .ring[data-k="${ring}"]`);
    if (!el || !el.offsetParent) return;
    const r = el.getBoundingClientRect(); if (r.bottom < 0 || r.top > window.innerHeight) return;
    const good = def.good === 0 ? null : v * def.good > 0;
    const f = document.createElement('div'); f.className = 'floaty';
    f.textContent = sgn(v, def.f); f.style.color = good === null ? '#84e3d5' : good ? '#7ddf8a' : '#ffd27a';
    f.style.left = (r.left + r.width / 2 + (key === 'gen' ? 26 : 0)) + 'px'; f.style.top = (r.top + 16) + 'px';
    document.body.appendChild(f);
    const anim = f.animate([{ transform: 'translate(-50%,0) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-14px) scale(1.15)', opacity: 1, offset: 0.2 }, { transform: 'translate(-50%,-50px) scale(1)', opacity: 0 }], { duration: 1700, delay: k * 110, easing: 'ease-out', fill: 'backwards' });
    k++; anim.onfinish = () => f.remove();
  });
}

/* ---------- Inclinación 3D y brillo que sigue al ratón ---------- */
let tiltEl = null, tiltRaf = 0, tiltEv = null;
function resetTilt(c) { c.style.setProperty('--rx', '0deg'); c.style.setProperty('--ry', '0deg'); }
function onPointerMove(e) {
  tiltEv = e; if (tiltRaf) return;
  tiltRaf = requestAnimationFrame(() => {
    tiltRaf = 0; const ev = tiltEv;
    if (ev.pointerType === 'mouse' && !reduceMotion()) {
      STAR.px = ev.clientX / window.innerWidth * 2 - 1; STAR.py = ev.clientY / window.innerHeight * 2 - 1;
      document.documentElement.style.setProperty('--px', STAR.px.toFixed(3)); document.documentElement.style.setProperty('--py', STAR.py.toFixed(3));
    }
    const c = ev.target && ev.target.closest ? ev.target.closest('.card:not(.dis), .tile, .pod, .medal, .pick') : null;
    if (tiltEl && tiltEl !== c) resetTilt(tiltEl);
    tiltEl = c;
    if (!c || ev.pointerType !== 'mouse' || reduceMotion()) return;
    const r = c.getBoundingClientRect(), x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
    const k = r.width > 320 ? 0.5 : c.classList.contains('medal') || c.classList.contains('pod') || c.classList.contains('pick') ? 1.8 : 1;
    c.style.setProperty('--mx', (x * 100) + '%'); c.style.setProperty('--my', (y * 100) + '%');
    c.style.setProperty('--rx', ((0.5 - y) * 8 * k).toFixed(2) + 'deg'); c.style.setProperty('--ry', ((x - 0.5) * 10 * k).toFixed(2) + 'deg');
  });
}

/* ---------- Cielo animado: estrellas con paralaje y estrellas fugaces ---------- */
const STAR = { raf: 0, stars: [], shoot: [], px: 0, py: 0, warp: 0, setup: null };
function startStarfield() {
  const c = $('#stars'); if (!c) return;
  const ctx = c.getContext('2d'); if (!ctx) return;
  const setup = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    c.width = window.innerWidth * dpr; c.height = window.innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(500, Math.round(window.innerWidth * window.innerHeight / 4500)), r = mulberry32(7);
    STAR.stars = Array.from({ length: n }, () => ({ x: r() * window.innerWidth, y: r() * window.innerHeight, z: r() * 0.9 + 0.1, tw: r() * 6.28, c: r() < 0.12 ? '#c3cef4' : r() < 0.22 ? '#a6f2ff' : '#ffffff' }));
  };
  setup(); STAR.setup = setup; window.addEventListener('resize', setup);
  let last = performance.now();
  const loop = now => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const W = window.innerWidth, H = window.innerHeight, sy = window.scrollY || 0;
    ctx.clearRect(0, 0, W, H);
    const ox = -STAR.px * 14, oy = -STAR.py * 10, wv = STAR.warp;
    if (wv > 0) {   // salto a velocidad luz: las estrellas se estiran desde el centro
      const cx = W / 2, cy = H * 0.6;
      ctx.lineCap = 'round';
      for (const s of STAR.stars) {
        const dx = s.x - cx, dy = s.y - cy, f = 1 + dt * (2 + 9 * wv) * (0.4 + s.z);
        s.x = cx + dx * f; s.y = cy + dy * f;
        if (s.x < -50 || s.x > W + 50 || s.y < -50 || s.y > H + 50) { s.x = cx + (Math.random() - 0.5) * W * 0.3; s.y = cy + (Math.random() - 0.5) * H * 0.3; }
        const len = 0.12 * wv * (0.5 + s.z);
        ctx.globalAlpha = 0.4 + 0.6 * s.z; ctx.strokeStyle = s.c; ctx.lineWidth = 0.8 + s.z * 1.6;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - (s.x - cx) * len, s.y - (s.y - cy) * len); ctx.stroke();
      }
    } else for (const s of STAR.stars) {
      s.x -= dt * 5 * s.z; if (s.x < 0) s.x += W;
      const x = ((s.x + ox * s.z) % W + W) % W, y = ((s.y - sy * s.z * 0.2 + oy * s.z) % H + H) % H;
      ctx.globalAlpha = (0.3 + 0.7 * Math.abs(Math.sin(now / 1000 * (0.5 + s.z) + s.tw))) * (0.35 + s.z * 0.65);
      ctx.fillStyle = s.c; const sz = 0.6 + s.z * 1.5; ctx.fillRect(x, y, sz, sz);
    }
    if (Math.random() < dt * 0.3 && STAR.shoot.length < 2) STAR.shoot.push({ x: W * (0.3 + Math.random() * 0.7), y: Math.random() * H * 0.45, vx: -(350 + Math.random() * 300), vy: 140 + Math.random() * 120, life: 1 });
    for (let i = STAR.shoot.length - 1; i >= 0; i--) {
      const p = STAR.shoot[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.1;
      if (p.life <= 0) { STAR.shoot.splice(i, 1); continue; }
      const tx = p.x - p.vx * 0.18, ty = p.y - p.vy * 0.18, g = ctx.createLinearGradient(p.x, p.y, tx, ty);
      g.addColorStop(0, `rgba(255,255,255,${p.life})`); g.addColorStop(1, 'rgba(184,166,255,0)');
      ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(tx, ty); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    STAR.raf = requestAnimationFrame(loop);
  };
  if (reduceMotion()) loop(performance.now()), cancelAnimationFrame(STAR.raf);
  else STAR.raf = requestAnimationFrame(loop);
}

/* ---------- Confeti de celebración ---------- */
function confetti(n = 160) {
  if (reduceMotion()) return;
  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:250';
  document.body.appendChild(c);
  const ctx = c.getContext('2d'); if (!ctx) { c.remove(); return; }
  const dpr = Math.min(2, window.devicePixelRatio || 1); c.width = window.innerWidth * dpr; c.height = window.innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = ['#84e3d5', '#b8a6ff', '#ffb59e', '#7ddf8a', '#f2c878', '#ffffff'];
  const ps = Array.from({ length: n }, (_, i) => ({ x: window.innerWidth / 2 + (Math.random() - 0.5) * 240, y: window.innerHeight * 0.35, vx: (Math.random() - 0.5) * 1000, vy: -Math.random() * 750 - 200, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12, w: 6 + Math.random() * 6, h: 4 + Math.random() * 7, c: cols[i % cols.length] }));
  let last = performance.now(), t = 0;
  const loop = now => {
    const dt = Math.min(0.04, (now - last) / 1000); last = now; t += dt;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    ps.forEach(p => { p.vy += 900 * dt; p.vx *= 0.99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - t / 3.6); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1); ctx.restore(); });
    if (t < 3.7) requestAnimationFrame(loop); else c.remove();
  };
  requestAnimationFrame(loop);
}

/* ---------- Informe: conteo de puntos y celebración ---------- */
function mountReport() {
  const res = S.lastResult; if (!res) return;
  if (S._celebrated === res.entryId) return;
  S._celebrated = res.entryId;
  const el = $('#score-count');
  if (el && !reduceMotion()) {
    const target = res.s.total, t0 = performance.now(), dur = 1600;
    el.textContent = '0';
    const step = now => { const k = clamp((now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(target * e); if (k < 1 && el.isConnected) { if (Math.random() < 0.3) SFX.tick(); requestAnimationFrame(step); } };
    requestAnimationFrame(step);
  }
  const good = res.s.rating.id === 'ok' || res.s.rating.id === 'exc';
  setTimeout(() => { if (good) { SFX.success(); confetti(res.s.rating.id === 'exc' ? 260 : 150); } else SFX.fail(); }, 900);
}

/* ---------- Holograma de la nave (SVG): las piezas nuevas aparecen con un “pop” ---------- */
function scSVG(m) {
  const W = 440, H = 300, cx = 220, cy = 108;
  const dims = [[40, 100], [64, 100], [80, 80], [98, 92], [118, 104]][m.st.size];
  const bw = dims[0], bh = dims[1], bx = cx - bw / 2, by = cy - bh / 2;
  const prev = S._scPrev, cur = new Set(), parts = [], labels = [];
  const part = (key, svg, label, color) => {
    cur.add(key);
    const isNew = !prev || !prev.has(key);
    parts.push(`<g class="part${isNew ? ' pop' : ''}"${isNew && !prev ? ` style="animation-delay:${(parts.length * 0.07).toFixed(2)}s"` : ''}>${svg}</g>`);
    if (label) labels.push([color, label]);
  };
  // paneles solares
  if (m.sp.id !== 'sp_cube_body') {
    const L = clamp(24 + Math.sqrt(m.sp.area) * 26, 30, 160) * (m.isCube ? 0.8 : 1);
    const ph = clamp(16 + Math.sqrt(m.sp.area) * 8, 18, bh * 0.75);
    let g = '';
    [-1, 1].forEach(side => {
      const x0 = side < 0 ? bx - 10 - L : bx + bw + 10;
      g += `<line x1="${side < 0 ? bx : bx + bw}" y1="${cy}" x2="${side < 0 ? x0 + L : x0}" y2="${cy}" stroke="#8f95b8" stroke-width="3"/>`;
      g += `<rect x="${x0}" y="${cy - ph / 2}" width="${L}" height="${ph}" rx="2" fill="url(#solarg)" stroke="#84e3d5" stroke-width="1"/>`;
      const cols = Math.max(2, Math.round(L / 14));
      for (let i = 1; i < cols; i++) g += `<line x1="${x0 + L * i / cols}" y1="${cy - ph / 2}" x2="${x0 + L * i / cols}" y2="${cy + ph / 2}" stroke="rgba(120,200,255,.5)" stroke-width="0.8"/>`;
      g += `<line x1="${x0}" y1="${cy}" x2="${x0 + L}" y2="${cy}" stroke="rgba(120,200,255,.5)" stroke-width="0.8"/>`;
    });
    part('sp:' + m.sp.id, g, m.sp.name, '#3f6bff');
  } else labels.push(['#3f6bff', m.sp.name]);
  if (m.th.id === 'th_active' || m.th.cryo) part('rad', `<rect x="${bx + bw + 2}" y="${by + 4}" width="6" height="${bh - 8}" fill="#f2f4ff" stroke="#99aaaa"/>`, m.th.cryo ? 'Radiador + criorefrigerador' : 'Radiador', '#f2f4ff');
  if (m.th.cryo) { let g = ''; for (let i = 0; i < 4; i++) g += `<polygon points="${cx - bw * 0.95 - i * 4},${by + bh + 16 + i * 5} ${cx},${by + bh + 7 + i * 5} ${cx + bw * 0.95 + i * 4},${by + bh + 16 + i * 5} ${cx},${by + bh + 25 + i * 5}" fill="rgba(255,181,158,${0.32 - i * 0.06})" stroke="#ff8be6" stroke-width="0.6"/>`; part('shade', g, 'Parasol multicapa', '#ffb59e'); }
  // cuerpo
  const shieldW = m.sh.id === 'heavy' ? 5 : m.sh.id === 'light' ? 3 : 1.2;
  let body = `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="4" fill="url(#mli)" stroke="${m.sh.id === 'none' ? '#f2c878' : '#a9b3d6'}" stroke-width="${shieldW}"/>`;
  if (m.sp.id === 'sp_cube_body') for (let i = 0; i < 3; i++) body += `<rect x="${bx + 4}" y="${by + 5 + i * (bh - 10) / 3}" width="${bw - 8}" height="${(bh - 10) / 3 - 3}" fill="url(#solarg)" stroke="#84e3d5" stroke-width="0.6"/>`;
  if (m.isCube) for (let i = 1; i < 3; i++) body += `<line x1="${bx}" y1="${by + bh * i / 3}" x2="${bx + bw}" y2="${by + bh * i / 3}" stroke="#8a7432" stroke-width="0.8"/>`;
  part('body:' + m.st.id + ':' + m.sh.id, body, m.sh.id !== 'none' ? m.sh.name : null, '#a9b3d6');
  // instrumentos
  const instrColor = i => i.tags.includes('xray') ? '#ff9f6b' : i.tags.includes('ir') ? '#ff8092' : i.tags.includes('radar') ? '#7ddf8a' : i.tags.includes('spectro') || i.tags.includes('atmos') ? '#b8a6ff' : i.tags.includes('mag') ? '#f2c878' : i.tags.includes('radiation') || i.tags.includes('particles') ? '#ffd27a' : i.tags.includes('altimetry') ? '#ffb59e' : i.tags.includes('ice') ? '#9ff3ff' : '#84e3d5';
  const tel = m.instr.filter(i => i.tags.includes('telescope')), others = m.instr.filter(i => !i.tags.includes('telescope'));
  tel.forEach((i, k) => {
    const tw = Math.min(bw * 0.8, 26 + i.mass / 120), th = clamp(30 + i.mass / 60, 34, 66);
    const tx = cx - tw / 2 + (k ? (k % 2 ? 1 : -1) * (tw * 0.6) : 0);
    part('in:' + i.id, `<rect x="${tx}" y="${by - th}" width="${tw}" height="${th}" rx="3" fill="#d6dcf0" stroke="${instrColor(i)}" stroke-width="2"/><ellipse cx="${tx + tw / 2}" cy="${by - th}" rx="${tw / 2}" ry="4" fill="#1f2c52" stroke="${instrColor(i)}"/>`, i.name, instrColor(i));
  });
  others.forEach((i, k) => {
    const n = others.length, iw = Math.min(24, (bw - 6) / Math.max(1, n) - 3), ix = bx + 3 + k * (iw + 3) + ((bw - 6) - n * (iw + 3) + 3) / 2;
    let g = `<rect x="${ix}" y="${by + bh - 2}" width="${iw}" height="13" rx="3" fill="${instrColor(i)}" stroke="#000000" stroke-width="0.6"/>`;
    if (i.tags.includes('mag') && !m.isCube) g += `<line x1="${bx}" y1="${by + 10}" x2="${bx - 40}" y2="${by - 30}" stroke="#f2c878" stroke-width="2"/><circle cx="${bx - 40}" cy="${by - 30}" r="4" fill="#f2c878"/>`;
    if (i.tags.includes('radar') && i.mass > 100) g += `<rect x="${bx - 12}" y="${by + bh + 13}" width="${bw + 24}" height="8" rx="2" fill="#7ddf8a" opacity="0.85"/>`;
    part('in:' + i.id, g, i.name, instrColor(i));
  });
  // antena
  const c = m.comm, ax = bx + bw * 0.75, ay = by;
  let ant;
  if (c.id === 'uhf_cube') ant = `<line x1="${bx + 2}" y1="${by + 2}" x2="${bx - 22}" y2="${by - 22}" stroke="#eaeefb"/><line x1="${bx + bw - 2}" y1="${by + 2}" x2="${bx + bw + 22}" y2="${by - 22}" stroke="#eaeefb"/>`;
  else if (c.id.startsWith('sband')) ant = `<rect x="${ax - 7}" y="${ay - 5}" width="14" height="5" rx="1" fill="#eaeefb"/>`;
  else if (c.id === 'laser') ant = `<rect x="${ax - 5}" y="${ay - 14}" width="10" height="14" fill="#cccccc"/><line x1="${ax}" y1="${ay - 14}" x2="${ax + 44}" y2="${ay - 64}" stroke="#ff8092" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  else { const big = c.gain > 1, r = big ? clamp(bw * 0.35, 12, 34) : 8; ant = `<line x1="${ax}" y1="${ay}" x2="${ax}" y2="${ay - 10}" stroke="#cccccc" stroke-width="2"/><path d="M ${ax - r} ${ay - 10 - r * 0.6} Q ${ax} ${ay - 2} ${ax + r} ${ay - 10 - r * 0.6}" fill="#eef0ff" stroke="#99aaaa" stroke-width="1"/>${c.id.startsWith('ka') ? `<circle cx="${ax}" cy="${ay - 10 - r * 0.3}" r="2" fill="#ffd27a"/>` : ''}`; }
  part('ant:' + c.id, `${ant}<circle cx="${ax}" cy="${ay - 14}" r="3" fill="#84e3d5" opacity=".9"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>`, c.name, '#eef0ff');
  // control de actitud
  m.adcs.forEach(a => {
    let g = '';
    if (a.kind === 'st') g = `<rect x="${bx + 2}" y="${by - 9}" width="7" height="9" fill="#555555" stroke="#aaaaaa"/><rect x="${bx + 11}" y="${by - 9}" width="7" height="9" fill="#555555" stroke="#aaaaaa"/>`;
    if (a.kind === 'rw') [0, 1, 2, 3].forEach(k => { g += `<circle cx="${bx + bw * (0.2 + 0.2 * k)}" cy="${cy}" r="${Math.min(5, bw / 12)}" fill="none" stroke="#84e3d5" stroke-width="1.3" stroke-dasharray="3 2"><animateTransform attributeName="transform" type="rotate" from="0 ${bx + bw * (0.2 + 0.2 * k)} ${cy}" to="360 ${bx + bw * (0.2 + 0.2 * k)} ${cy}" dur="${1.5 + k * 0.3}s" repeatCount="indefinite"/></circle>`; });
    if (a.kind === 'mtq') g = `<rect x="${bx + 4}" y="${cy + bh * 0.28}" width="${bw - 8}" height="3" fill="#e08a3a"/>`;
    part('ad:' + a.id, g, a.name, a.kind === 'rw' ? '#84e3d5' : a.kind === 'st' ? '#888888' : '#e08a3a');
  });
  // propulsión
  if (m.prop.id !== 'none') {
    const nw = m.isCube ? 6 : clamp(bw * 0.18, 8, 20);
    let g = `<polygon points="${cx - nw / 2},${by + bh} ${cx + nw / 2},${by + bh} ${cx + nw},${by + bh + nw * 1.4} ${cx - nw},${by + bh + nw * 1.4}" fill="#6b7088" stroke="#aaaaaa"/>`;
    g += `<ellipse cx="${cx}" cy="${by + bh + nw * 1.7}" rx="${nw * 0.9}" ry="4" fill="${m.prop.lowThrust ? '#6fd0ff' : '#ffd27a'}" opacity=".85"><animate attributeName="opacity" values=".3;.9;.3" dur=".5s" repeatCount="indefinite"/></ellipse>`;
    part('pr:' + m.prop.id, g, m.prop.name, '#ffd27a');
  }
  if (m.d.redundancy) part('red', `<circle cx="${bx + bw}" cy="${by}" r="11" fill="#0f3d2a" stroke="#7ddf8a"/><text x="${bx + bw}" y="${by + 4}" text-anchor="middle" font-size="10" fill="#c9ffe6" font-family="system-ui">×2</text>`, 'Redundancia', '#7ddf8a');
  S._scPrev = cur;
  const uniq = labels.filter((l, i, a) => a.findIndex(x => x[1] === l[1]) === i).slice(0, 12);
  const legend = uniq.map((l, i) => { const col = i % 2, row = Math.floor(i / 2), x = 14 + col * (W / 2), y = 222 + row * 14; return `<rect x="${x}" y="${y - 8}" width="9" height="9" rx="2" fill="${l[0]}"/><text x="${x + 14}" y="${y}" font-size="10.5" fill="#e1e7fa" font-family="system-ui,sans-serif">${esc(l[1].length > 40 ? l[1].slice(0, 38) + '…' : l[1])}</text>`; }).join('');
  return `<svg class="scsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Holograma de la nave: ${esc(m.st.name)} con ${m.instr.map(i => esc(i.name)).join(', ') || 'ningún instrumento'}">
    <defs><linearGradient id="mli" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2c878"/><stop offset="1" stop-color="#b98a2c"/></linearGradient>
      <linearGradient id="solarg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3fd1"/><stop offset=".5" stop-color="#425cae"/><stop offset="1" stop-color="#1a9fd6"/></linearGradient>
      <radialGradient id="pad" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="rgba(132,227,213,.35)"/><stop offset="1" stop-color="rgba(132,227,213,0)"/></radialGradient></defs>
    <ellipse cx="${cx}" cy="${by + bh + 40}" rx="170" ry="20" fill="url(#pad)"/>
    <ellipse cx="${cx}" cy="${by + bh + 40}" rx="150" ry="16" fill="none" stroke="rgba(132,227,213,.45)" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="2s" repeatCount="indefinite"/></ellipse>
    <text x="14" y="22" font-size="12.5" font-weight="700" fill="#84e3d5" font-family="system-ui,sans-serif">${esc(m.st.name)} · ${fmtKg(m.wet)} · ${fmtW(m.cons)}</text>
    <g class="craft">${parts.join('')}</g>${legend}</svg>`;
}
